  <script>
/*
 * Écran « Suivi » : bilan de la semaine, calories adaptatives, poids, forme, progression par exercice,
 * volume par muscle (mannequin), mensurations, photos ; le tableau jour par jour s'ouvre à la demande.
 * Graphiques en SVG faits main : aucune bibliothèque à charger.
 */
var Views = window.Views || {};

Views.trends = (function () {
  var W = 340, H = 170, PAD = { l: 34, r: 10, t: 12, b: 22 };

  // ---------------------------------------------------------------- bulles de détail des graphiques

  /** Attributs d'un point qui a une bulle : position (unités du viewBox) et lignes du texte. */
  function tipAttr(x, y, lines) {
    return ' data-tx="' + Number(x).toFixed(1) + '" data-ty="' + Number(y).toFixed(1) + '" data-tip="' + U.esc(lines.filter(Boolean).join('\n')) + '"';
  }
  function box(svg) { return '<div class="chart-box">' + svg + '</div>'; }

  var NS = 'http://www.w3.org/2000/svg', current = null;
  function hideTip() {
    if (!current) return;
    current.classList.remove('tipping');
    var t = current.parentNode.querySelector('.chart-tip');
    if (t) t.hidden = true;
    current = null;
  }
  /** Bulle sur le point le plus proche (en x) du doigt ou du curseur. */
  function showTip(svg, clientX) {
    var pts = svg.querySelectorAll('[data-tip]');
    if (!pts.length) return;
    var r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    var vx = vb.x + (clientX - r.left) / r.width * vb.width, pick = null, dist = Infinity;
    for (var i = 0; i < pts.length; i++) {
      var d = Math.abs(Number(pts[i].getAttribute('data-tx')) - vx);
      if (d < dist) { dist = d; pick = pts[i]; }
    }
    if (current && current !== svg) hideTip();
    current = svg;
    svg.classList.add('tipping');
    var tx = Number(pick.getAttribute('data-tx')), ty = Number(pick.getAttribute('data-ty'));
    var guide = svg.querySelector('.tip-guide'), ring = svg.querySelector('.tip-ring');
    if (!guide) {
      guide = document.createElementNS(NS, 'line'); guide.setAttribute('class', 'tip-guide');
      ring = document.createElementNS(NS, 'circle'); ring.setAttribute('class', 'tip-ring'); ring.setAttribute('r', '6');
      svg.insertBefore(guide, svg.firstChild); svg.appendChild(ring);
    }
    guide.setAttribute('x1', tx); guide.setAttribute('x2', tx); guide.setAttribute('y1', vb.y); guide.setAttribute('y2', vb.y + vb.height - 18);
    ring.setAttribute('cx', tx); ring.setAttribute('cy', ty);
    var boxEl = svg.parentNode, tip = boxEl.querySelector('.chart-tip');
    if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; boxEl.appendChild(tip); }
    var lines = pick.getAttribute('data-tip').split('\n');
    tip.innerHTML = '<b>' + U.esc(lines[0]) + '</b>' + lines.slice(1).map(function (l) { return '<span>' + U.esc(l) + '</span>'; }).join('');
    tip.hidden = false;
    var px = (tx - vb.x) / vb.width * r.width, py = (ty - vb.y) / vb.height * r.height;
    var tw = tip.offsetWidth, th = tip.offsetHeight, bw = boxEl.clientWidth;
    tip.style.left = Math.max(0, Math.min(bw - tw, px - tw / 2)) + 'px';
    tip.style.top = (py - th - 12 >= -8 ? py - th - 12 : py + 14) + 'px';
  }
  document.addEventListener('pointerdown', function (e) {
    var svg = e.target.closest && e.target.closest('.tip-chart');
    if (svg) showTip(svg, e.clientX); else hideTip();
  }, true);
  document.addEventListener('pointermove', function (e) {
    var svg = e.target.closest && e.target.closest('.tip-chart');
    if (svg && (e.pointerType === 'mouse' || current === svg)) showTip(svg, e.clientX);
    else if (!svg && e.pointerType === 'mouse') hideTip();
  });

  function weightChart(daily, end, days) {
    var start = U.addDays(end, -(days - 1));
    var m = {};
    daily.forEach(function (d) { m[d.date] = d; });
    var pts = [], avg = [];
    for (var i = 0; i < days; i++) {
      var date = U.addDays(start, i);
      if (m[date] && typeof m[date].weight === 'number') pts.push({ i: i, v: m[date].weight });
      var a = Calc.weightAvg(daily, date, U.addDays);
      if (a !== null) avg.push({ i: i, v: a });
    }
    if (pts.length < 2) return '<p class="muted">Il faut au moins 2 pesées pour tracer la courbe.</p>';
    var all = pts.concat(avg).map(function (p) { return p.v; });
    var lo = Math.floor((Math.min.apply(null, all) - 0.3) * 2) / 2, hi = Math.ceil((Math.max.apply(null, all) + 0.3) * 2) / 2;
    var x = function (i) { return PAD.l + i * (W - PAD.l - PAD.r) / (days - 1); };
    var y = function (v) { return PAD.t + (hi - v) * (H - PAD.t - PAD.b) / (hi - lo); };
    var grid = '';
    var step = hi - lo > 4 ? 1 : 0.5;
    for (var g = lo; g <= hi + 1e-9; g += step) {
      grid += '<line x1="' + PAD.l + '" x2="' + (W - PAD.r) + '" y1="' + y(g) + '" y2="' + y(g) + '" class="grid"/>' +
        '<text x="' + (PAD.l - 6) + '" y="' + (y(g) + 3) + '" class="axis" text-anchor="end">' + U.nf(g) + '</text>';
    }
    var ticks = '';
    [0, Math.floor((days - 1) / 2), days - 1].forEach(function (i) {
      ticks += '<text x="' + x(i) + '" y="' + (H - 6) + '" class="axis" text-anchor="' + (i === 0 ? 'start' : i === days - 1 ? 'end' : 'middle') + '">' + U.shortDate(U.addDays(start, i)) + '</text>';
    });
    var avgAt = {};
    avg.forEach(function (p) { avgAt[p.i] = p.v; });
    var dots = pts.map(function (p) {
      var date = U.addDays(start, p.i);
      return '<circle cx="' + x(p.i) + '" cy="' + y(p.v) + '" r="2.6" class="dot"' + tipAttr(x(p.i), y(p.v),
        [U.dayLetter(date) + ' ' + U.shortDate(date), 'Pesée : ' + U.nf(p.v) + ' kg', avgAt[p.i] != null ? 'Moyenne 7 j : ' + U.nf(avgAt[p.i]) + ' kg' : '']) + '/>';
    }).join('');
    var line = avg.length > 1 ? '<polyline class="trend" points="' + avg.map(function (p) { return x(p.i) + ',' + y(p.v); }).join(' ') + '"/>' : '';
    return box('<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart tip-chart" role="img" aria-label="Poids sur ' + days + ' jours">' + grid + ticks + line + dots + '</svg>') +
      '<div class="legend"><span><i class="lg-dot"></i>Pesée du jour</span><span><i class="lg-line"></i>Moyenne 7 jours</span></div>';
  }

  function readinessChart(daily, end, days) {
    var m = {};
    daily.forEach(function (d) { m[d.date] = d; });
    var start = U.addDays(end, -(days - 1));
    var bw = (W - PAD.l - PAD.r) / days;
    var h = 110, base = h - 20;
    var bars = '', any = false;
    for (var i = 0; i < days; i++) {
      var date = U.addDays(start, i);
      var s = Calc.readiness(m[date]);
      if (s !== null) {
        any = true;
        var bh = Math.max(2, s / 25 * (base - 8));
        bars += '<rect x="' + (PAD.l + i * bw + 1.5) + '" y="' + (base - bh) + '" width="' + Math.max(2, bw - 3) + '" height="' + bh + '" rx="2" class="' + (s < 12.5 ? 'bar-low' : 'bar') + '"' +
          tipAttr(PAD.l + i * bw + bw / 2, base - bh, [U.dayLetter(date) + ' ' + U.shortDate(date), 'Forme : ' + U.nf(s) + ' / 25']) + '/>';
      }
      if (U.dow(date) === 1) bars += '<text x="' + (PAD.l + i * bw + bw / 2) + '" y="' + (h - 6) + '" class="axis" text-anchor="middle">' + U.shortDate(date) + '</text>';
    }
    if (!any) return '<p class="muted">Le score apparaît dès que le check-in du matin est rempli.</p>';
    var y25 = 8, y125 = base - (base - 8) / 2;
    var axis = '<text x="' + (PAD.l - 6) + '" y="' + (y25 + 3) + '" class="axis" text-anchor="end">25</text>' +
      '<line x1="' + PAD.l + '" x2="' + (W - PAD.r) + '" y1="' + y125 + '" y2="' + y125 + '" class="grid"/>' +
      '<text x="' + (PAD.l - 6) + '" y="' + (y125 + 3) + '" class="axis" text-anchor="end">12,5</text>';
    return box('<svg viewBox="0 0 ' + W + ' ' + h + '" class="chart tip-chart" role="img" aria-label="Score de forme sur ' + days + ' jours">' + axis + bars + '</svg>');
  }

  function table(daily, end, days) {
    var m = {};
    daily.forEach(function (d) { m[d.date] = d; });
    var intake = Review.intakeByDay(Store.list('FOOD_LOG'));
    var rows = '';
    for (var i = 0; i < days; i++) {
      var date = U.addDays(end, -i), d = m[date] || {}, k = intake[date];
      var s = Calc.readiness(d);
      rows += '<tr data-goto="' + date + '"><td>' + U.dayLetter(date) + ' ' + U.shortDate(date) + '</td><td>' + U.nf(d.weight) + '</td><td>' +
        (k && k.kcal ? U.nf(k.kcal, 0) : '–') + '</td><td>' + (d.steps ? U.nf(d.steps, 0) : '–') + '</td><td>' + U.nf(d.sleepH) + '</td><td>' + (s === null ? '–' : U.nf(s)) + '</td></tr>';
    }
    return '<div class="table-wrap"><table class="data"><thead><tr><th>Jour</th><th>Poids</th><th>Kcal</th><th>Pas</th><th>Sommeil</th><th>Forme</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /** Toutes les séances faites (les plus récentes d'abord) : [{ key, date, name, exercises: [{ name, sets }], sets, volume }]. */
  function workoutLog() {
    var by = {};
    Store.list('SETS').forEach(function (s) {
      if (!s.date || !s.exercise) return;
      var k = s.sessionId || (s.date + ' ' + (s.session || ''));
      var w = by[k] = by[k] || { key: k, date: s.date, name: s.session || 'Séance', ex: {}, order: [], sets: 0, volume: 0 };
      if (!w.ex[s.exercise]) { w.ex[s.exercise] = []; w.order.push(s.exercise); }
      w.ex[s.exercise].push(s);
      w.sets++;
      if (typeof s.load === 'number' && typeof s.reps === 'number') w.volume += s.load * s.reps;
    });
    return Object.keys(by).map(function (k) {
      var w = by[k];
      w.exercises = w.order.map(function (n) { return { name: n, sets: w.ex[n].sort(function (a, b) { return (a.setNo || 0) - (b.setNo || 0); }) }; });
      return w;
    }).sort(function (a, b) { return a.date === b.date ? (a.name < b.name ? -1 : 1) : (a.date < b.date ? 1 : -1); });
  }
  function fmtSet(x) { return (x.reps == null ? '?' : U.nf(x.reps, 0)) + ' × ' + (x.load == null ? '–' : U.nf(x.load) + ' kg'); }

  function workoutsHtml(list, n) {
    if (!list.length) return '<p class="muted">Aucune séance enregistrée pour l\'instant.</p>';
    return '<p class="muted small">' + list.length + ' séance' + (list.length > 1 ? 's' : '') + ' en tout, de la plus récente à la plus ancienne.</p>' +
      list.slice(0, n).map(function (w) {
        var sess = Store.get('SESSIONS', w.key) || {};
        var meta = [w.sets + ' séries', U.nf(w.volume / 1000, 1) + ' t', sess.durationMin ? sess.durationMin + ' min' : '', sess.rpe != null ? 'RPE ' + sess.rpe : ''].filter(Boolean).join(' · ');
        return '<div class="wk"><div class="wk-head"><b>' + U.esc(w.name) + '</b><span class="muted small">' + U.dayLetter(w.date) + ' ' + U.shortDate(w.date) + ' ' + w.date.slice(0, 4) + '</span></div>' +
          '<p class="muted small">' + meta + (sess.note ? ' · ' + U.esc(sess.note) : '') + '</p>' +
          '<ul class="wk-ex">' + w.exercises.map(function (e) {
            return '<li><span>' + U.esc(e.name) + '</span><span class="muted small">' + e.sets.map(fmtSet).join(' · ') + '</span></li>';
          }).join('') + '</ul></div>';
      }).join('') +
      (n < list.length ? '<button class="btn ghost block" data-more-wk>20 séances de plus</button>' : '');
  }

  /** Feuille « Toutes les données » : jours (tableau, 30 jours de plus à chaque appui) ou séances (liste complète). */
  function openData(app, state) {
    var daily = Store.list('DAILY'), end = U.today(), days = 30, nWk = 20, tab = state.dataTab || 'days', log = null;
    var oldest = daily.reduce(function (o, d) { return d.date && d.date < o ? d.date : o; }, end);
    var max = Math.max(30, U.daysBetween(oldest, end) + 1);
    var body = function () {
      if (tab === 'workouts') return workoutsHtml(log || (log = workoutLog()), nWk);
      return '<p class="muted small">Poids en kg, sommeil en heures, forme sur 25. Touche un jour pour l\'ouvrir.</p>' + table(daily, end, Math.min(days, max)) +
        (days < max ? '<button class="btn ghost block" data-more-days>30 jours de plus</button>' : '');
    };
    var seg = '<div class="seg data-seg">' + [['days', 'Jours'], ['workouts', 'Séances']].map(function (t) {
      return '<button data-data-tab="' + t[0] + '" aria-pressed="' + (t[0] === tab) + '">' + t[1] + '</button>';
    }).join('') + '</div>';
    app.openSheet({
      title: 'Toutes les données',
      html: seg + '<div data-data-body>' + body() + '</div>',
      bind: function (sh) {
        var redraw = function () { sh.querySelector('[data-data-body]').innerHTML = body(); if (window.Liquid && Liquid.track) Liquid.track(400); };
        sh.addEventListener('click', function (e) {
          var t = e.target.closest('[data-data-tab]');
          if (t) {
            tab = state.dataTab = t.getAttribute('data-data-tab');
            sh.querySelectorAll('[data-data-tab]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === t)); });
            return redraw();
          }
          if (e.target.closest('[data-more-days]')) { days += 30; return redraw(); }
          if (e.target.closest('[data-more-wk]')) { nWk += 20; return redraw(); }
          var row = e.target.closest('[data-goto]');
          if (row) { state.date = row.getAttribute('data-goto'); state.tab = 'today'; app.closeSheet(); app.render(); }
        });
      }
    });
  }

  // ---------------------------------------------------------------- courbe générique

  /**
   * Courbe d'une série de points datés [{ date, v }] (du plus ancien), axe des dates proportionnel.
   * opts = { unit, dec, label, detail(p) → lignes en plus dans la bulle }. Le record est marqué et légendé ;
   * toucher ou survoler la courbe affiche le détail du point le plus proche.
   */
  function lineChart(pts, opts) {
    opts = opts || {};
    if (pts.length < 2) return '<p class="muted">' + (pts.length ? 'Une seule séance pour l\'instant : la courbe apparaît à la deuxième.' : 'Pas encore de séance enregistrée.') + '</p>';
    var w = W, h = 160, P = { l: 36, r: 12, t: 14, b: 22 };
    var vs = pts.map(function (p) { return p.v; });
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    var span = hi - lo || Math.max(1, hi * 0.1);
    var raw = span / 3, mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), n = raw / mag;
    var step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    lo = Math.floor((lo - span * 0.08) / step) * step; hi = Math.ceil((hi + span * 0.08) / step) * step;
    if (lo < 0 && Math.min.apply(null, vs) >= 0) lo = 0;
    var d0 = pts[0].date, total = Math.max(1, U.daysBetween(d0, pts[pts.length - 1].date));
    var x = function (p) { return P.l + U.daysBetween(d0, p.date) / total * (w - P.l - P.r); };
    var y = function (v) { return P.t + (hi - v) / (hi - lo) * (h - P.t - P.b); };
    var dec = opts.dec || 0, grid = '';
    for (var g = lo; g <= hi + step / 1e6; g += step) {
      grid += '<line x1="' + P.l + '" x2="' + (w - P.r) + '" y1="' + y(g) + '" y2="' + y(g) + '" class="grid"/>' +
        '<text x="' + (P.l - 6) + '" y="' + (y(g) + 3) + '" class="axis" text-anchor="end">' + U.nf(g, step < 1 ? 1 : 0) + '</text>';
    }
    var ticks = '<text x="' + P.l + '" y="' + (h - 5) + '" class="axis">' + U.shortDate(d0) + '</text>' +
      '<text x="' + (w - P.r) + '" y="' + (h - 5) + '" class="axis" text-anchor="end">' + U.shortDate(pts[pts.length - 1].date) + '</text>';
    var line = pts.map(function (p) { return x(p).toFixed(1) + ',' + y(p.v).toFixed(1); }).join(' ');
    var area = '<polygon class="area" points="' + x(pts[0]).toFixed(1) + ',' + y(lo) + ' ' + line + ' ' + x(pts[pts.length - 1]).toFixed(1) + ',' + y(lo) + '"/>';
    var best = Math.max.apply(null, vs), bi = vs.lastIndexOf(best);
    var unit = opts.unit ? ' ' + opts.unit : '';
    var dots = pts.map(function (p, i) {
      var lines = [U.dayLetter(p.date) + ' ' + U.shortDate(p.date) + ' ' + p.date.slice(0, 4), (opts.name || '') + (opts.name ? ' : ' : '') + U.nf(p.v, dec) + unit + (i === bi ? ' · record' : '')]
        .concat(opts.detail ? opts.detail(p) : []);
      return '<circle cx="' + x(p).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (i === bi ? 4.5 : 3) + '" class="' + (i === bi ? 'dot-best' : 'dot-accent') + '"' +
        tipAttr(x(p), y(p.v), lines) + '/>';
    }).join('');
    var bx = x(pts[bi]), by = y(best);
    var peak = '<text class="peak" x="' + bx.toFixed(1) + '" y="' + (by - 9).toFixed(1) + '" text-anchor="' + (bx > w - 40 ? 'end' : bx < P.l + 30 ? 'start' : 'middle') + '">' + U.nf(best, dec) + unit + '</text>';
    return box('<svg viewBox="0 0 ' + w + ' ' + h + '" class="chart tip-chart" role="img" aria-label="' + U.esc(opts.label || '') + '">' + grid + ticks + area +
      '<polyline class="trend" points="' + line + '"/>' + dots + peak + '</svg>');
  }

  // ---------------------------------------------------------------- progression par exercice

  var METRICS = [
    ['e1rm', '1RM', '1RM estimé', 'kg', 1, 'Charge qu\'on pourrait soulever une fois, estimée d\'après la meilleure série de la séance (formule d\'Epley).'],
    ['load', 'Charge', 'Charge max', 'kg', 1, 'Charge la plus lourde de la séance.'],
    ['reps', 'Reps', 'Répétitions', 'reps', 0, 'Répétitions totales de la séance, toutes séries comprises.'],
    ['sets', 'Séries', 'Séries', 'séries', 0, 'Séries faites dans la séance.'],
    ['volume', 'Volume', 'Volume', 'kg', 0, 'Tonnage de la séance : charge × répétitions, additionnés.']
  ];

  function progressBlock(name, metric) {
    var mt = METRICS.filter(function (m) { return m[0] === metric; })[0] || METRICS[0];
    var prog = Train.progress(Store.list('SETS'), name);
    var pts = prog.filter(function (d) { return d[mt[0]] !== null && d[mt[0]] > 0; }).map(function (d) { return { date: d.date, v: d[mt[0]] }; });
    var stats = '';
    if (pts.length) {
      var first = pts[0].v, last = pts[pts.length - 1].v, best = Math.max.apply(null, pts.map(function (p) { return p.v; }));
      var pct = first ? (last - first) / first * 100 : null;
      stats = '<div class="stats three">' +
        '<div class="stat"><span class="tile-label">Record</span><b>' + U.nf(best, mt[4]) + ' ' + mt[3] + '</b></div>' +
        '<div class="stat"><span class="tile-label">Dernière</span><b>' + U.nf(last, mt[4]) + ' ' + mt[3] + '</b></div>' +
        '<div class="stat"><span class="tile-label">Évolution</span><b class="' + (pct > 0 ? 'ok' : pct < 0 ? 'neg' : '') + '">' + (pct === null || pts.length < 2 ? '–' : U.signed(pct, 0) + ' %') + '</b></div></div>';
    }
    var byDate = {};
    Train.history(Store.list('SETS'), name).forEach(function (d) { byDate[d.date] = d.sets; });
    var detail = function (p) {
      var ss = byDate[p.date] || [];
      return [ss.length + ' série' + (ss.length > 1 ? 's' : '') + ' : ' + ss.map(function (x) { return (x.reps == null ? '?' : U.nf(x.reps, 0)) + ' × ' + (x.load == null ? '–' : U.nf(x.load) + ' kg'); }).join(' · ')];
    };
    return stats + lineChart(pts, { unit: mt[3], dec: mt[4], label: mt[2] + ' : ' + name, name: mt[1], detail: detail }) +
      '<p class="muted small">' + mt[5] + ' ' + prog.length + ' séance' + (prog.length > 1 ? 's' : '') + '.</p>';
  }

  function progressCard(state) {
    var done = Train.exercisesDone(Store.list('SETS'));
    if (!done.length) return '';
    var name = state.progEx && done.some(function (e) { return e.name === state.progEx; }) ? state.progEx : (done.filter(function (e) { return e.sessions > 1; })[0] || done[0]).name;
    var metric = state.progMetric || 'e1rm';
    return '<section class="card" data-prog><div class="card-head"><h2>Progression</h2><span class="muted small">par séance</span></div>' +
      '<select class="input picker" data-prog-ex aria-label="Exercice">' + done.map(function (e) {
        return '<option' + (e.name === name ? ' selected' : '') + '>' + U.esc(e.name) + '</option>';
      }).join('') + '</select>' +
      '<div class="seg prog-seg">' + METRICS.map(function (m) { return '<button data-metric="' + m[0] + '" aria-pressed="' + (m[0] === metric) + '">' + m[1] + '</button>'; }).join('') + '</div>' +
      '<div data-prog-body>' + progressBlock(name, metric) + '</div></section>';
  }


  // ---------------------------------------------------------------- bilans

  function plannedPerWeek() {
    var n = 0;
    try { JSON.parse(Store.list('SETTINGS').planning || '[]').forEach(function (d) { if (d.session) n++; }); } catch (e) { /* idem */ }
    return n || null;
  }

  function weekRange(offset) {
    var start = Store.list('SETTINGS').startDate;
    var today = U.today();
    var from;
    if (start && start <= today) {
      var n = Math.floor(U.daysBetween(start, today) / 7);
      from = U.addDays(start, 7 * (n - offset));
    } else {
      from = U.addDays(today, 1 - U.dow(today) - 7 * offset);
    }
    return { from: from, to: U.addDays(from, 6) };
  }

  function weekSummary(offset) {
    var r = weekRange(offset);
    var kcalTarget = function (d) {
      var t = Calc.targetFor(Store.list('TARGETS'), d);
      if (!t) return null;
      return Calc.dayPlan(Store.list('SETTINGS'), U.dow(d)).on ? t.kcalOn : (t.kcalOff || t.kcalOn);
    };
    var w = Review.week({ daily: Store.list('DAILY'), sessions: Store.list('SESSIONS'), log: Store.list('FOOD_LOG'),
      plannedSessions: plannedPerWeek(), kcalTarget: kcalTarget }, r.from, r.to, U.addDays, Calc.readiness);
    w.label = U.shortDate(r.from) + ' au ' + U.shortDate(r.to);
    return w;
  }

  function reviewCard() {
    var w = weekSummary(0), prev = weekSummary(1);
    var cell = function (label, v, pv, unit, dec) {
      var diff = v !== null && pv !== null && pv !== undefined ? v - pv : null;
      return '<div class="stat"><span class="tile-label">' + label + '</span><b>' + (v === null ? '–' : U.nf(v, dec) + (unit ? ' ' + unit : '')) + '</b>' +
        (diff !== null && Math.abs(diff) > 0 ? '<span class="muted small">' + U.signed(diff, dec) + ' vs sem. préc.</span>' : '<span class="muted small">&nbsp;</span>') + '</div>';
    };
    return '<section class="card"><div class="card-head"><h2>Bilan de la semaine</h2><span class="muted small">' + w.label + '</span></div>' +
      '<div class="stats">' +
      cell('Poids moyen', w.weight, prev.weight, 'kg', 2) +
      '<div class="stat"><span class="tile-label">Séances</span><b>' + w.sessionsDone + (w.sessionsPlanned ? ' / ' + w.sessionsPlanned : '') + '</b><span class="muted small">&nbsp;</span></div>' +
      cell('Calories moy.', w.kcal, prev.kcal, 'kcal', 0) +
      cell('Protéines moy.', w.protein, prev.protein, 'g', 0) +
      cell('Pas moyens', w.steps, prev.steps, '', 0) +
      cell('Sommeil moy.', w.sleep, prev.sleep, 'h', 1) +
      cell('Forme moy.', w.readiness, prev.readiness, '/25', 1) +
      '<div class="stat"><span class="tile-label">Repas loggés</span><b>' + w.loggedDays + ' / 7 j</b><span class="muted small">' + (w.onTarget !== null ? w.onTarget + ' j à ±10 % de l\'objectif' : '&nbsp;') + '</span></div>' +
      '</div></section>';
  }

  function tdeeCard() {
    var daily = Store.list('DAILY');
    var t = Review.tdee(daily, Store.list('FOOD_LOG'), U.today(), U.addDays, U.daysBetween, 21);
    var weight = Calc.weightAvg(daily, U.today(), U.addDays);
    var cur = Calc.targetFor(Store.list('TARGETS'), U.today());
    var body;
    if (!t.ok) {
      body = '<p class="muted">Il faut au moins 10 jours de repas loggés et 8 pesées sur les 3 dernières semaines (' + t.loggedDays + ' jours loggés pour l\'instant). ' +
        'Ensuite l\'app calcule ta dépense réelle à partir de ce que tu manges et de l\'évolution de ton poids.</p>';
    } else {
      var sug = Review.suggestedKcal(t.tdee, weight, 0.35);
      body = '<div class="stats">' +
        '<div class="stat"><span class="tile-label">Dépense estimée</span><b>' + U.nf(t.tdee, 0) + ' kcal</b><span class="muted small">par jour</span></div>' +
        '<div class="stat"><span class="tile-label">Mangé en moyenne</span><b>' + U.nf(t.intake, 0) + ' kcal</b><span class="muted small">' + t.loggedDays + ' jours loggés</span></div>' +
        '<div class="stat"><span class="tile-label">Poids</span><b>' + U.signed(t.weeklyChange, 2) + ' kg</b><span class="muted small">par semaine</span></div>' +
        '<div class="stat"><span class="tile-label">Conseillé</span><b>' + U.nf(sug, 0) + ' kcal</b><span class="muted small">pour +0,35 %/sem.</span></div></div>' +
        (cur ? '<p class="muted small">Objectif actuel : ' + U.nf(cur.kcalOn, 0) + ' kcal (ON) / ' + U.nf(cur.kcalOff || cur.kcalOn, 0) + ' kcal (OFF).</p>' : '') +
        '<button class="btn soft block" data-apply-kcal="' + sug + '">Appliquer ' + U.nf(sug, 0) + ' kcal à partir d\'aujourd\'hui</button>';
    }
    return '<section class="card"><div class="card-head"><h2>Calories adaptatives</h2><span class="muted small">21 derniers jours</span></div>' + body + '</section>';
  }

  function volumeCard() {
    var to = U.today(), from = U.addDays(to, -6);
    var vol = Train.weeklyVolume(Store.list('SETS'), from, to, Store.list('EXERCISES'));
    var keys = Object.keys(vol).sort(function (a, b) { return vol[b] - vol[a]; });
    var max = Math.max(20, keys.length ? vol[keys[0]] : 0);
    return '<section class="card"><div class="card-head"><h2>Volume par muscle</h2><span class="muted small">séries, 7 derniers jours</span></div>' +
      Body.svg(vol) + (keys.length ? '' : '<p class="muted">Aucune série cette semaine : le mannequin se colore au fil des séances.</p>') +
      keys.map(function (k) {
        var v = vol[k];
        return '<div class="vol-row"><span>' + U.esc(k) + '</span><div class="vol-track"><div class="vol-zone" style="left:' + (10 / max * 100) + '%;width:' + (10 / max * 100) + '%"></div>' +
          '<div class="vol-fill' + (v < 10 ? ' low' : '') + '" style="width:' + (v / max * 100) + '%"></div></div><b>' + v + '</b></div>';
      }).join('') + '<p class="muted small">Zone claire : 10 à 20 séries par semaine, la fourchette habituelle pour progresser.</p></section>';
  }

  var MEASURE_FIELDS = [['waist', 'Tour de taille'], ['chest', 'Poitrine'], ['arm', 'Bras (contracté)'], ['thigh', 'Cuisse'], ['hips', 'Hanches']];

  function measuresCard() {
    var list = Store.list('MEASURES').slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var last = list[0], prev = list[1];
    return '<section class="card"><div class="card-head"><h2>Mensurations</h2><button class="link" data-measure>+ Ajouter</button></div>' +
      (last ? '<p class="muted small">Dernière prise : ' + U.shortDate(last.date) + (prev ? ' (vs ' + U.shortDate(prev.date) + ')' : '') + '</p><div class="stats">' +
        MEASURE_FIELDS.filter(function (f) { return typeof last[f[0]] === 'number'; }).map(function (f) {
          var d = prev && typeof prev[f[0]] === 'number' ? last[f[0]] - prev[f[0]] : null;
          return '<div class="stat"><span class="tile-label">' + f[1] + '</span><b>' + U.nf(last[f[0]]) + ' cm</b><span class="muted small">' + (d !== null ? U.signed(d) + ' cm' : '&nbsp;') + '</span></div>';
        }).join('') + '</div>' : '<p class="muted">Toutes les 2 semaines, le matin, au même endroit : c\'est le meilleur complément au poids en prise de masse.</p>') +
      '</section>';
  }

  function openMeasure(app) {
    app.openSheet({
      title: 'Mensurations du jour',
      html: '<p class="muted small">Mètre ruban, à jeun, sans serrer.</p><div class="fields">' + MEASURE_FIELDS.map(function (f) {
        return '<label class="field"><span class="field-label">' + f[1] + '</span><span class="field-box"><input data-k="' + f[0] + '" inputmode="decimal"><span class="unit">cm</span></span></label>';
      }).join('') + '</div><button class="btn primary block" data-ok>Enregistrer</button>',
      bind: function (p) {
        p.querySelector('[data-ok]').addEventListener('click', function () {
          var rec = { id: 'm-' + U.today(), date: U.today() };
          var any = false;
          MEASURE_FIELDS.forEach(function (f) { var v = U.parseNum(p.querySelector('[data-k="' + f[0] + '"]').value); rec[f[0]] = v; if (v !== null) any = true; });
          if (!any) { app.toast('Aucune mesure saisie'); return; }
          Store.put('MEASURES', rec);
          app.closeSheet(); app.render(); app.toast('Mensurations enregistrées');
        });
      }
    });
  }

  function render(state) {
    var daily = Store.list('DAILY');
    var end = U.today();
    var trend = Calc.weightTrend(daily, end, U.addDays);
    var status = Calc.gainStatus(trend.pct);
    var sleep7 = [];
    for (var i = 0; i < 7; i++) { var d = daily.filter(function (x) { return x.date === U.addDays(end, -i); })[0]; if (d && typeof d.sleepH === 'number') sleep7.push(d.sleepH); }
    var range = state.trendDays || 28;
    return reviewCard() + tdeeCard() + '<section class="card">' +
      '<div class="card-head"><h2>Poids</h2><div class="pills">' + [28, 42, 90].map(function (n) {
        return '<button class="pill' + (n === range ? ' on' : '') + '" data-range="' + n + '">' + n + ' j</button>';
      }).join('') + '</div></div>' +
      '<p class="lead">' + (trend.avg === null ? 'Pas encore assez de pesées.' : 'Moyenne 7 j : <b>' + U.nf(trend.avg, 2) + ' kg</b>' +
        (trend.delta === null ? '' : ', ' + U.signed(trend.delta, 2) + ' kg sur 7 jours (' + U.signed(trend.pct, 2) + ' %). ' + (status ? '<span class="' + status.key + '">' + status.text + '</span> (+0,25 à +0,5 %/sem.)' : ''))) + '</p>' +
      weightChart(daily, end, range) +
      '</section>' +
      '<section class="card"><div class="card-head"><h2>Forme</h2><span class="muted small">28 derniers jours</span></div>' +
      '<p class="lead">Sommeil moyen 7 j : <b>' + (sleep7.length ? U.nf(Calc.mean(sleep7)) + ' h' : '–') + '</b></p>' +
      readinessChart(daily, end, 28) + '</section>' +
      progressCard(state) + volumeCard() + measuresCard() + Photos.card() +
      '<button class="btn ghost block all-data" data-all-data>' + App.icon('list') + 'Afficher toutes les données</button>';
  }

  function header() {
    return Views.head('Suivi', 'Bilans, tendances et historique',
      '<button class="icon-btn" data-glass="c1" data-open-settings aria-label="Réglages et couleurs">' + App.icon('settings') + '</button>');
  }

  function bind(root, state, app) {
    Photos.hydrate(root);
    Photos.bind(app, root);
    root.addEventListener('change', function (e) {
      var sel = e.target.closest('[data-prog-ex]');
      if (!sel) return;
      state.progEx = sel.value;
      root.querySelector('[data-prog-body]').innerHTML = progressBlock(state.progEx, state.progMetric || 'e1rm');
    });
    root.addEventListener('click', function (e) {
      if (e.target.closest('[data-measure]')) return openMeasure(app);
      if (e.target.closest('[data-all-data]')) return openData(app, state);
      var mb = e.target.closest('[data-metric]');
      if (mb) {
        state.progMetric = mb.getAttribute('data-metric');
        mb.parentNode.querySelectorAll('[data-metric]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === mb)); });
        var sel2 = root.querySelector('[data-prog-ex]');
        root.querySelector('[data-prog-body]').innerHTML = progressBlock(sel2 ? sel2.value : '', state.progMetric);
        return;
      }
      var ak = e.target.closest('[data-apply-kcal]');
      if (ak) {
        var k = Number(ak.getAttribute('data-apply-kcal'));
        var cur = Calc.targetFor(Store.list('TARGETS'), U.today()) || {};
        var gap = (cur.kcalOn || k) - (cur.kcalOff || cur.kcalOn || k); // garde l'écart ON/OFF du coach
        Store.put('TARGETS', { id: 'u-' + U.today(), from: U.today(), kcalOn: k, kcalOff: k - gap, steps: cur.steps, note: 'Ajustement automatique' });
        app.render();
        app.toast('Nouvel objectif : ' + U.nf(k, 0) + ' kcal');
        return;
      }
      var r = e.target.closest('[data-range]');
      if (r) { state.trendDays = Number(r.getAttribute('data-range')); app.render(); return; }
    });
  }

  return { render: render, header: header, bind: bind, lineChart: lineChart, progressBlock: progressBlock, METRICS: METRICS };
})();

window.Views = Views;
</script>

  <script>
/*
 * Démarrage et habillage (direction artistique reprise de GymScript) :
 * navigation, en-tête flottant, feuilles, minuteur de repos, notifications, thème de couleurs.
 * Les formes flottantes sont dessinées par Liquid (verre liquide WebGL) ; sans WebGL, le CSS prend le relais.
 */
(function () {
  var Glass = window.Liquid;
  var $scroll = document.getElementById('scroll');
  var $head = document.getElementById('head');
  var $dock = document.getElementById('dock');

  var $overlay = document.getElementById('overlay');
  var $toast = document.getElementById('toast');
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---------------------------------------------------------------- icônes (trait, sans remplissage)

  var PATHS = {
    today: '<path d="M4.5 10.4 12 4l7.5 6.4V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19v-8.6Z"/>',
    train: '<path d="M7 6.5v11M17 6.5v11M3.5 9.5v5M20.5 9.5v5M7 12h10"/>',
    food: '<path d="M12 7.2c-1.6-1.3-4.2-1.5-5.8.3-1.9 2-1.6 5.5-.1 8.4 1.3 2.5 3.4 4.8 5.9 3.8 2.5 1 4.6-1.3 5.9-3.8 1.5-2.9 1.8-6.4-.1-8.4-1.6-1.8-4.2-1.6-5.8-.3Z"/><path d="M12 7.2c.1-1.9 1.1-3.3 3-3.9"/>',
    trends: '<path d="M4 19.5h16"/><path d="M6 15.5l4-4.5 3 3 5-6.5"/>',

    check: '<path pathLength="1" d="M5 12.5 10 17.5 19 7"/>',
    x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
    left: '<path d="M14.5 6 8.5 12l6 6"/>',
    right: '<path d="M9.5 6l6 6-6 6"/>',
    plus: '<path d="M12 5.5v13M5.5 12h13"/>',
    scan: '<path d="M4 8V6.5A2.5 2.5 0 0 1 6.5 4H8M16 4h1.5A2.5 2.5 0 0 1 20 6.5V8M20 16v1.5a2.5 2.5 0 0 1-2.5 2.5H16M8 20H6.5A2.5 2.5 0 0 1 4 17.5V16M8 8.5v7M11 8.5v7M14 8.5v7M17 8.5v7"/>',
    list: '<path d="M9 7h10M9 12h10M9 17h10M5 7h.01M5 12h.01M5 17h.01"/>',
    bolt: '<path d="M13 3.5 5.5 13.5H12l-1 7 7.5-10H12l1-7Z"/>',
    copy: '<rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/>',
    flag: '<path d="M5.5 20.5v-16M5.5 5h11l-2 4 2 4h-11"/>',
    video: '<rect x="3.5" y="6.5" width="12" height="11" rx="2.5"/><path d="M15.5 10.5l5-3v9l-5-3"/>',
    play: '<path d="M8 5.5v13l10.5-6.5L8 5.5Z"/>',
    trash: '<path d="M5 7h14M10 7V5h4v2M7 7l1 12.5h8L17 7"/>'
  };
  function icon(name, cls) {
    return '<svg class="icon ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (PATHS[name] || '') + '</svg>';
  }

  var TABS = [
    { id: 'today', label: 'Jour' },
    { id: 'train', label: 'Séance' },
    { id: 'food', label: 'Nutrition' },
    { id: 'trends', label: 'Suivi' }
  ];
  var TAB_IDS = TABS.map(function (t) { return t.id; });
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem('grind:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('grind:' + k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }
  };
  var state = { tab: LS.get('tab', 'today'), date: U.today(), trendDays: 28 };
  if (TAB_IDS.indexOf(state.tab) < 0) state.tab = 'today';

  var app = {
    render: render,
    toast: toast,
    ls: LS,
    state: state,
    icon: icon,
    go: function (tab) {
      if (tab === state.tab) { $scroll.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' }); return; }
      var dir = TAB_IDS.indexOf(tab) > TAB_IDS.indexOf(state.tab) ? 'r' : 'l';
      state.tab = tab; LS.set('tab', tab); closeSheet(); render({ dir: dir }); $scroll.scrollTop = 0;
    },
    scrollY: function () { return $scroll.scrollTop; },
    scrollTo: function (y) { $scroll.scrollTop = y || 0; },
    openSheet: openSheet,
    closeSheet: closeSheet,
    startTimer: startTimer,
    stopTimer: stopTimer,
    openSettings: openSettings,
    haptic: function (ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) { /* non supporté */ } }
  };
  window.App = app;

  // ---------------------------------------------------------------- en-tête

  /** En-tête flottant : carte de verre (titre, sous-titre, état de synchro) et boutons en gouttes à droite. */
  Views.head = function (title, sub, right) {
    return '<header class="page-head"><div class="ph-card" data-glass="main"><div class="ph-text"><h1>' + title + '</h1>' +
      (sub ? '<div class="ph-sub">' + sub + '</div>' : '') + '</div>' + syncBadge(Store.status()) + '</div>' + (right || '') + '</header>';
  };
  /** En-tête avec navigation de jour, partagé par Jour et Nutrition. */
  Views.dateHeader = function (st, title) {
    var week = Calc.weekNumber(Store.list('SETTINGS').startDate, st.date, U.daysBetween);
    var isToday = st.date === U.today();
    var sub = (isToday ? U.longDate(st.date) : title) + (week ? ' · Semaine ' + week : '');
    return Views.head(isToday ? title : U.longDate(st.date), sub,
      '<div class="date-nav"><button class="icon-btn" data-glass="c1" data-nav-day="-1" aria-label="Jour précédent">' + icon('left') + '</button>' +
      '<button class="icon-btn" data-glass="c2" data-nav-day="1" aria-label="Jour suivant"' + (st.date >= U.today() ? ' disabled' : '') + '>' + icon('right') + '</button></div>');
  };

  function syncBadge(s) {
    if (s.error && s.pending) return '<span class="sync error" id="sync" title="' + U.esc(s.error) + '"><i></i><span>Hors ligne</span></span>';
    if (s.syncing) return '<span class="sync saving" id="sync"><i></i><span>Envoi…</span></span>';
    if (s.pending) return '<span class="sync saving" id="sync"><i></i><span>' + s.pending + ' en attente</span></span>';
    return '<span class="sync ok" id="sync" title="Tout est enregistré"><i></i><span>Enregistré</span></span>';
  }

  function mountHead(html, animate) {
    $head.innerHTML = html;
    var hd = $head.firstElementChild;
    if (hd && animate && !reduceMotion) hd.classList.add('head-in');
    var keep = {};
    $head.querySelectorAll('[data-glass]').forEach(function (el) {
      var id = 'h:' + el.dataset.glass, main = el.dataset.glass === 'main';
      keep[id] = true;
      // la carte se déforme d'un écran à l'autre ; les boutons sortent d'elle comme des gouttes
      Glass.attach(id, el, { role: main ? 'head' : el.dataset.tint === 'accent' ? 'accent' : 'circle', from: main ? null : 'h:main', radius: main ? 28 : 'pill' });
    });
    Glass.prune('h:', keep);
  }

  // Au défilement, la carte d'en-tête se resserre sur le titre (deux repères invisibles, aucun écouteur de défilement).
  var headCompact = false;
  function setCompact(on) {
    if (on === headCompact) return;
    headCompact = on;
    $head.classList.toggle('compact', on);
    Glass.track();
  }
  if ('IntersectionObserver' in window) {
    $scroll.insertAdjacentHTML('afterbegin', '<i class="mark" style="top:42px"></i><i class="mark" style="top:18px"></i>');
    var marks = $scroll.querySelectorAll('.mark');
    var markIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.target === marks[0] && !en.isIntersecting) setCompact(true);

    markIO.observe(marks[1]);

  // ---------------------------------------------------------------- rendu

  var lastTab = null;
  function render(opt) {
    opt = opt || {};
    var view = Views[state.tab] || Views.today;
    var dir = opt.dir || (lastTab === null ? 'fade' : lastTab !== state.tab ? 'r' : null);
    var old = document.getElementById('view');
    var ghost = !!(dir && old && old.firstChild && lastTab !== null && !reduceMotion);
    if (ghost) ghostOut(old, dir);
    mountHead(view.header(state, app), !!dir);

    var fresh = document.createElement('main');
    fresh.id = 'view';

    fresh.innerHTML = view.render(state, app);

    view.bind(fresh, state, app);

    if (dir) intro(fresh, dir, ghost);
    renderNav();
    renderDock();
  }

  function decorate(scope) {
    scope.querySelectorAll('.seg').forEach(function (s) { segSync(s); });
    addFrost(scope);
  }

  /** L'écran qui part reste visible un instant, figé à sa position, le temps de s'effacer. */
  function ghostOut(node, dir) {
    var y = $scroll.scrollTop, g = document.createElement('div');

    g.style.top = -y + 'px';
    g.style.transformOrigin = '50% ' + Math.round(y + window.innerHeight * 0.45) + 'px';
    node.removeAttribute('id');
    node.querySelectorAll('[id]').forEach(function (el) { el.removeAttribute('id'); });
    var vh = window.innerHeight;
    node.querySelectorAll('.card, .tile').forEach(function (c) { var r = c.getBoundingClientRect(); if (r.bottom < 0 || r.top > vh) c.style.visibility = 'hidden'; });

    document.body.appendChild(g);
    setTimeout(function () { if (g.parentNode) g.parentNode.removeChild(g); }, 320);
  }

  // Apparition : chaque bloc monte et se pose comme une goutte, en cascade puis au fil du défilement.
  var io = !reduceMotion && 'IntersectionObserver' in window
    ? new IntersectionObserver(onReveal, { rootMargin: '0px 0px -6% 0px', threshold: 0.08 }) : null;
  var REVEAL = '.card, .tiles, .tool-row, .view > p, .view > .btn';
  var OFFSETS = { r: ['32px', '0px'], l: ['-32px', '0px'], up: ['0px', '44px'], down: ['0px', '-14px'], fade: ['0px', '18px'] };
  var firstBatch = null;
  function intro(v, dir, afterGhost) {
    if (!io) return;
    io.disconnect();
    firstBatch = { dir: dir, base: afterGhost ? 100 : 0 };
    v.querySelectorAll(REVEAL).forEach(function (el) {
      if (el.parentNode.closest('.card')) return;
      el.classList.add('rv');
      el.querySelectorAll('.tile').forEach(function (t, i) { t.style.setProperty('--i', i); });
      io.observe(el);
    });
  }
  function onReveal(entries) {
    var fb = firstBatch, k = 0;
    firstBatch = null;
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      var el = en.target, d = (fb ? fb.base : 0) + Math.min(k++, 7) * (fb ? 55 : 70);
      io.unobserve(el);
      if (fb) { el.style.setProperty('--rx', OFFSETS[fb.dir][0]); el.style.setProperty('--ry', OFFSETS[fb.dir][1]); }
      el.style.setProperty('--d', d + 'ms');
      el.classList.add('in');
    });
  }

  /** Pastille glissante des contrôles segmentés : position (--i) et nombre d'options (--n). */
  function segSync(seg, animate) {
    var btns = Array.prototype.filter.call(seg.children, function (b) { return b.tagName === 'BUTTON'; }), idx = -1;
    btns.forEach(function (b, i) { if (b.getAttribute('aria-pressed') === 'true') idx = i; });

    seg.classList.add('thumb');

  }

    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';
    document.body.appendChild(probe);
    var env = probe.getBoundingClientRect().height;
    probe.parentNode.removeChild(probe);
    var full = window.innerHeight >= (window.screen && screen.height || 1e9) - 1 && window.innerWidth < 600;
    if (env > 0 || !full) document.documentElement.style.removeProperty('--sat');
    else document.documentElement.style.setProperty('--sat', (screen.height >= 852 ? 59 : 47) + 'px');
  }
  fixTopInset();
  window.addEventListener('resize', fixTopInset);

  // Clavier refermé : l'iPhone laisse parfois la page décalée.
  document.addEventListener('focusout', function () {
    setTimeout(function () {
      var a = document.activeElement;
      if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) window.scrollTo(0, 0);
    }, 60);
  });

  // Envoi immédiat quand l'app passe en arrière-plan (changement d'app, verrouillage).
  document.addEventListener('visibilitychange', function () { if (document.hidden) Store.flush(); });
  window.addEventListener('pagehide', function () { Store.flush(); });

  // Retour sur l'app un autre jour : on se replace sur aujourd'hui.
  var openedOn = U.today();
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && U.today() !== openedOn) { openedOn = U.today(); state.date = openedOn; render(); }
    if (!document.hidden) renderDock();
  });

  applyLook(false);
  Store.init(window.BOOT);
  // Retour du scanner externe par l'adresse de l'app (?scan=CODE) : on ouvre le produit dans le bon repas.
  var L = window.LAUNCH || {}, scanSig = L.scan ? [L.scan, L.meal, L.date].join('|') : null;
  var scanSeen = LS.get('scanSeen', null);
  var doScan = scanSig && !(scanSeen && scanSeen.sig === scanSig && Date.now() - scanSeen.at < 30 * 60000); // pas sur un simple rechargement
  if (doScan) {
    LS.set('scanSeen', { sig: scanSig, at: Date.now() });
    state.tab = 'food';
    if (L.date && L.date <= U.today()) state.date = L.date;
  }
  render();
  if (doScan) setTimeout(function () { Views.food.lookupBarcode(L.scan, L.meal || Nutri.meals(Store.list('SETTINGS'))[0]); }, 350);
  if (window.BOOT_ERROR) toast('Données hors ligne : ' + window.BOOT_ERROR, { error: true });

  // ---------------------------------------------------------------- app hors de Google (web/shell.html)
  // Les données gardées sur le téléphone s'affichent tout de suite, puis celles du Sheet arrivent (un appel).
  var WEB = window.GRIND_WEB, lastBoot = 0, loading = false;
  function busy() {
    var a = document.activeElement;
    return (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || $overlay.querySelector('.sheet:not(.closing)');
  }
  function refresh() {
    if (!WEB || !WEB.api || loading) return;
    loading = true;
    U.server('api_boot').then(function (json) {
      loading = false; lastBoot = Date.now();
      var before = JSON.stringify(Store.data());
      Store.init(JSON.parse(json));
      if (JSON.stringify(Store.data()) === before) return;
      if (busy()) { var again = function () { if (busy()) setTimeout(again, 1500); else render(); }; setTimeout(again, 1500); } else render();
    }).catch(function (e) { loading = false; if (!/reliée/.test(e.message)) toast('Sheet injoignable : ' + e.message, { error: true }); });
  }
  function linkSheet() {
    openSheet({
      title: 'Relier l\'app à ton Sheet',
      html: '<p class="muted">Dans ton Google Sheet : menu <b>Grind → Ouvrir l\'app</b>. Ouvre ce lien sur ce téléphone, ou copie-le et colle-le ici.</p>' +
        '<label class="field"><span class="field-box"><input data-link placeholder="https://hontans.github.io/…#api=…" autocomplete="off"></span></label>' +
        '<button class="btn primary block" data-link-ok>Relier</button>',
      bind: function (sh) {
        sh.querySelector('[data-link-ok]').addEventListener('click', function () {
          if (!WEB.link(sh.querySelector('[data-link]').value.trim())) { toast('Lien non reconnu : copie-le en entier', { error: true }); return; }
          closeSheet(); toast('App reliée au Sheet'); refresh(); Store.flush();
        });
      }
    });
  }
  if (WEB) {
    WEB.onAuth = function () { if (!$overlay.querySelector('.sheet:not(.closing)')) linkSheet(); };
    if (WEB.api) refresh(); else setTimeout(linkSheet, 500);
    // Retour sur l'app après un moment : les saisies faites ailleurs (Sheet, autre appareil) arrivent.
    document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - lastBoot > 5 * 60000) refresh(); });
    app.linkSheet = linkSheet;
  }
})();
</script>

</body>
</html>
