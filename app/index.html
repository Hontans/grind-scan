/* ============================================================== tokens */
/*
 * Direction artistique (reprise de GymScript) : verre liquide posé sur un fond de couleur généré.
 * - Formes flottantes (onglets, en-tête, minuteur, feuilles, notifications) : dessinées par Liquid (WebGL).
 *   Ici, leur style n'est que le secours quand WebGL manque (html sans la classe .gl).
 * - Cartes : le fond déjà flouté une fois pour toutes (.fr), jamais de backdrop-filter : c'est ce qui garde le défilement fluide.
 * - Les couleurs d'accent (--accent, --accent-grad, --accent-ink…) et le fond viennent du thème choisi (Themes),
 *   posées par App sur la racine ; les valeurs ci-dessous ne servent qu'avant le démarrage.
 */
:root {
  --font: 'Google Sans', 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: var(--font);

  --bg: #0A0910;
  --veil: rgba(8, 7, 13, .7);

  --card: rgba(14, 12, 22, .4);
  --card-base: #191721;                            /* fond d'une carte le temps que son verre arrive */
  --card-2: rgba(255, 255, 255, .06);
  --solid: #15131D;
  --card-glow: inset 0 0 20px rgba(255, 255, 255, .03);
  --rim: conic-gradient(from 212deg at 50% 50%, rgba(255, 255, 255, .72), rgba(196, 178, 255, .2) 16%, rgba(130, 220, 255, .1) 32%, rgba(255, 255, 255, .07) 50%, rgba(255, 176, 224, .14) 66%, rgba(255, 255, 255, .44) 84%, rgba(255, 255, 255, .72));
  --lift: 0 18px 36px -26px rgba(0, 0, 0, .85);
  --field: rgba(255, 255, 255, .08);
  --field-hover: rgba(255, 255, 255, .13);
  --field-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .06);
  --thumb: rgba(255, 255, 255, .17);
  /* pastille-lentille : liseré, lueur et légère séparation des couleurs sur les côtés */
  --thumb-shadow: inset 0 0 0 .75px rgba(255, 255, 255, .34), inset 0 0 9px rgba(255, 255, 255, .13), inset 2px 0 2px -2px rgba(255, 92, 130, .75), inset -2px 0 2px -2px rgba(90, 190, 255, .75), 0 4px 12px -5px rgba(0, 0, 0, .55);
  --pill: rgba(255, 255, 255, .12);

  --glass: rgba(26, 24, 36, .5);
  --glass-strong: rgba(20, 18, 28, .78);
  --glass-press: rgba(62, 58, 82, .55);
  --optics: inset 0 0 0 .75px rgba(255, 255, 255, .3), inset 0 0 14px rgba(255, 255, 255, .07);
  --glow: rgba(255, 255, 255, .22);
  --float: 0 18px 40px -16px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .25);
  --float-sm: 0 8px 20px -10px rgba(0, 0, 0, .7);
  --scrim: rgba(5, 4, 10, .52);

  --line: rgba(255, 255, 255, .1);
  --line-2: rgba(255, 255, 255, .17);
  --text: #FFFFFF;
  --text-2: rgba(255, 255, 255, .68);
  --text-3: rgba(255, 255, 255, .46);

  --accent: #6D4AFF;
  --accent-grad: linear-gradient(180deg, rgba(133, 104, 255, .94) 0%, rgba(99, 64, 245, .94) 100%);
  --on-accent: #FFFFFF;
  --accent-ink: #BDAEFF;
  --accent-soft: rgba(138, 110, 255, .2);
  --accent-line: rgba(170, 150, 255, .55);
  --accent-glow: rgba(109, 74, 255, .55);
  --accent-shadow: inset 0 0 0 .75px rgba(255, 255, 255, .34), inset 0 0 12px rgba(255, 255, 255, .2), inset 2px 0 2px -2px rgba(255, 110, 190, .8), inset -2px 0 2px -2px rgba(110, 210, 255, .8), 0 12px 24px -12px var(--accent-glow);

  --pos: #8BE3A8;
  --neg: #FF9C92;
  --warn: #F0CC7A;

  --m-p: #7EA6F5;
  --m-c: #DDB04B;
  --m-f: #E584AE;

  --r-lg: 26px;
  --r: 18px;
  --r-sm: 14px;
  --r-xs: 10px;
  --gutter: 16px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-in: cubic-bezier(.3, 0, .8, .15);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --liquid: cubic-bezier(.34, 1.56, .64, 1);       /* remplacés plus bas par de vrais ressorts amortis */
  --liquid-soft: cubic-bezier(.22, 1.2, .36, 1);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --nav-h: 64px;
  --nav-b: max(14px, calc(var(--sab) - 8px));
  --head-h: 66px;
  --glass-gap: 14px;                               /* au-delà de cet écart, deux formes ne fusionnent pas au repos */
  color-scheme: dark;
}

@supports (transition-timing-function: linear(0, 1)) {
  :root {
    --liquid: linear(0, 0.047, 0.166, 0.327, 0.503, 0.675, 0.828, 0.954, 1.049, 1.114, 1.15, 1.163, 1.158, 1.14, 1.114, 1.086, 1.057, 1.032, 1.01, 0.994, 0.983, 0.976, 0.974, 0.974, 0.977, 0.981, 0.985, 0.99, 0.994, 0.998, 1.001, 1.003, 1.004, 1.004, 1.004, 1.004, 1.003, 1.003, 1.002, 1.001, 1);
    --liquid-soft: linear(0, 0.052, 0.173, 0.325, 0.482, 0.625, 0.748, 0.846, 0.92, 0.972, 1.006, 1.026, 1.036, 1.038, 1.036, 1.031, 1.026, 1.02, 1.014, 1.009, 1.006, 1.003, 1.001, 1, 0.999, 0.999, 0.999, 0.999, 0.999, 0.999, 1);
  }
}

@media (prefers-color-scheme: light) {

    --bg: #E8E6EF;

    --lift: 0 16px 32px -24px rgba(50, 40, 100, .42);

    --field-hover: rgba(44, 36, 90, .11);
    --field-shadow: inset 0 0 0 .5px rgba(44, 36, 90, .05);
    --thumb: rgba(255, 255, 255, .86);
    --thumb-shadow: inset 0 0 0 .75px #fff, inset 0 0 8px rgba(255, 255, 255, .9), inset 2px 0 2px -2px rgba(255, 92, 150, .55), inset -2px 0 2px -2px rgba(70, 170, 255, .55), 0 4px 12px -5px rgba(50, 40, 100, .32);
    --pill: rgba(44, 36, 90, .08);
    --glass: rgba(255, 255, 255, .58);
    --glass-strong: rgba(250, 249, 253, .84);
    --glass-press: rgba(255, 255, 255, .78);
    --optics: inset 0 0 0 .75px #fff, inset 0 0 12px rgba(255, 255, 255, .6);
    --glow: rgba(255, 255, 255, .75);
    --float: 0 16px 36px -16px rgba(50, 40, 100, .32), 0 2px 6px rgba(50, 40, 100, .08);
    --float-sm: 0 6px 16px -8px rgba(50, 40, 100, .28);
    --scrim: rgba(40, 32, 76, .26);
    --line: rgba(24, 20, 44, .09);
    --line-2: rgba(24, 20, 44, .16);
    --text: #100F18;
    --text-2: rgba(16, 15, 24, .64);
    --text-3: rgba(16, 15, 24, .44);
    --accent: #6440F5;
    --accent-grad: linear-gradient(180deg, rgba(120, 90, 255, .96) 0%, rgba(90, 54, 236, .96) 100%);
    --on-accent: #FFFFFF;
    --accent-ink: #5635E0;
    --accent-soft: rgba(100, 64, 245, .13);
    --accent-line: rgba(100, 64, 245, .36);
    --accent-glow: rgba(100, 64, 245, .4);
    --pos: #1F7C40;
    --neg: #BE3B30;
    --warn: #96620A;
    --m-p: #3D6FD9;
    --m-c: #B07F12;
    --m-f: #BE4C7C;
    color-scheme: light;
  }
}

/* ============================================================== base */
*, *::before, *::after { box-sizing: border-box; }
/* la page elle-même ne bouge jamais : seul #scroll défile, sans rebond en haut ni en bas */
html { -webkit-text-size-adjust: 100%; background: var(--bg); height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  margin: 0;
  height: 100%;
  background: transparent;
  color: var(--text);
  font: 400 15px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
#scroll {
  position: fixed; left: 0; top: 0; right: 0; bottom: 0;
  overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior: none;
  scrollbar-width: none;
}
#scroll::-webkit-scrollbar { display: none; }

/* le fond du thème, fixe sous tout le reste */
#bg { position: fixed; left: 0; top: 0; bottom: 0; width: 100%; z-index: -1; overflow: hidden; background: var(--bg); pointer-events: none; }
#bg i { position: absolute; inset: 0; background-size: cover; background-position: 50% 100%; transition: opacity .55s ease; }
#bg .bg-l { opacity: 0; }
.lq-light #bg .bg-l { opacity: 1; }

/* moteur de verre : WebGL (31), texte et icônes par-dessus (32 et plus) */
#lq { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 31; pointer-events: none; } /* même boîte que les éléments fixés : le verre reste sous ses icônes */
/* un élément suivi par le moteur n'a plus de matière propre : le verre est dessiné dessous */
.gl [data-glass] { background: none !important; box-shadow: none !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
.gl [data-glass]::after { display: none !important; }

/* haut et bas de l'écran : le contenu s'efface avant de passer sous les verres */
#veil-t, #veil-b { position: fixed; left: 0; right: 0; z-index: 28; pointer-events: none; }
#veil-t {
  top: 0; height: calc(var(--sat) + 58px);
  background: linear-gradient(to bottom, var(--veil) 30%, transparent);
}
#veil-b {
  bottom: 0; height: calc(var(--nav-h) + var(--nav-b) + 26px);
  background: linear-gradient(to top, var(--veil), transparent);
  opacity: .62;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: default; }
a { color: inherit; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent-soft); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* icônes au trait, sans remplissage, comme dans la vidéo */
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.icon.sm { width: 19px; height: 19px; }
.icon.xs { width: 15px; height: 15px; stroke-width: 2.2; }

/* liseré du verre, avec un soupçon de prisme */
.icon-btn::after, .timer::after, .toast::after, .btn.primary::after, .wk::after, .ph-card::after, .tabbar nav::after, .sheet::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  padding: 1px;
  background: var(--rim);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}
/* lueur qui suit le doigt (--tx, --ty posés au toucher) */
.btn::before, .icon-btn::before, .timer .ctl button::before, .check::before, .choice button::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(circle at var(--tx, 50%) var(--ty, 50%), var(--glow), transparent 70%);
  opacity: 0; transition: opacity .7s ease;
}
.btn.primary::before { background: radial-gradient(circle at var(--tx, 50%) var(--ty, 50%), rgba(255, 255, 255, .4), transparent 70%); }
.btn:active::before, .icon-btn:active::before, .timer .ctl button:active::before, .check:active::before, .choice button:active::before {
  opacity: 1; transition-duration: .06s;
}

/* ============================================================== layout */
#app { height: 100%; }
.view {
  max-width: 560px;
  margin: 0 auto;
  padding: calc(var(--sat) + 10px + var(--head-h) + 16px) var(--gutter) calc(var(--nav-h) + var(--nav-b) + 40px);
}
.view.with-dock { padding-bottom: calc(var(--nav-h) + var(--nav-b) + 124px); }

/* En-tête flottant : une carte de verre (titre, sous-titre) et des gouttes pour les actions. */
.page-head {
  position: fixed; z-index: 32; top: calc(var(--sat) + 10px); left: 0; right: 0;
  max-width: 560px; margin: 0 auto; padding: 0 var(--gutter);
  display: flex; align-items: center; gap: var(--glass-gap);
  pointer-events: none;
}
.page-head > * { pointer-events: auto; }
.ph-card {
  position: relative; flex: 1; min-width: 0; height: var(--head-h);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 20px; border-radius: 28px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(170%);
  backdrop-filter: blur(18px) saturate(170%);
  box-shadow: var(--optics), var(--float-sm);
}
.ph-text { min-width: 0; flex: 1; }
.ph-card h1, .ph-card strong {
  display: block; margin: 0; font: 600 19px/1.22 var(--font); letter-spacing: -.012em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ph-sub {
  display: block; margin-top: 2px; font-size: 13.5px; line-height: 1.3; color: var(--text-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: opacity .22s var(--ease-out);
}
.page-head .icon-btn { width: 50px; height: 50px; flex: none; }
.page-head .btn.sm { height: 50px; padding: 0 18px; flex: none; }
.gl .page-head .btn.primary { color: var(--on-accent); }
.date-nav { display: flex; align-items: center; gap: var(--glass-gap); flex: none; }
/* texte de l'en-tête quand on change d'écran : le verre glisse, le texte se pose */
.head-in .ph-text, .head-in .icon-btn svg, .head-in .sync { animation: headText .46s var(--ease-out) backwards; }
.head-in .btn { animation: dockText .46s var(--ease-out) backwards; } /* pas de déplacement : le moteur mesure ce bouton */
@keyframes headText { from { opacity: 0; transform: translateY(5px); } }
/* au défilement l'en-tête se resserre sur le titre */
#head.compact .page-head:not(.wk-head) { --head-h: 50px; }
#head.compact .page-head:not(.wk-head) .ph-card { border-radius: 25px; }
#head.compact .page-head:not(.wk-head) .ph-sub { opacity: 0; height: 0; margin: 0; }
#head.compact .page-head:not(.wk-head) .ph-card h1 { font-size: 17px; }

.lead { margin: 0 6px 14px; font-size: 13.5px; line-height: 1.45; color: var(--text-2); }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--text-2); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 6px 10px; }
.section-title h2 { margin: 0; font: 600 16px/1.25 var(--font); letter-spacing: -.008em; color: var(--text); }
.section-title .link { font-size: 13.5px; color: var(--text-2); }

.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* ============================================================== surfaces */
/*
 * Une carte = un liseré (bordure en dégradé), la photo déjà floutée (.fr) et une lueur intérieure.
 * contain : un chiffre qui change dans une carte ne fait recalculer que cette carte, pas toute la page.
 * overflow: clip et non hidden : hidden ferait de la carte son propre cadre de défilement et casserait le sticky de .fr.
 */
.card {
  position: relative; isolation: isolate; overflow: hidden; overflow: clip; contain: layout;
  border: 1px solid transparent;
  background: linear-gradient(var(--card-base), var(--card-base)) padding-box, var(--rim) border-box;
  border-radius: var(--r-lg);
  box-shadow: var(--lift);
  padding: 17px;
}
.card::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: var(--card-glow); }
/*
 * La photo floutée, de la taille de l'écran, immobile quand la carte défile, sans aucun script :
 * .fr-w déborde de la carte d'un écran en haut et en bas (la carte coupe ce qui dépasse), et .fr y reste collée
 * au haut de l'écran. Tant que la carte est visible, .fr-w couvre tout l'écran, donc .fr ne décroche jamais.
 */
.fr-w {
  position: absolute; display: block; z-index: -1; pointer-events: none;
  top: calc(-1 * var(--fr-h, 100vh) - 1px); bottom: calc(-1 * var(--fr-h, 100vh) - 1px);
  left: calc(var(--fr-x, 0px) - var(--cx, 0px)); width: var(--fr-w, 100vw);
}
.fr {
  display: block; position: -webkit-sticky; position: sticky; top: var(--fr-y, 0px);
  width: 100%; height: var(--fr-h, 100vh); max-width: none;
  will-change: transform; pointer-events: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
@supports not (overflow: clip) { .fr-w { display: none; } } /* iOS 15 et avant : carte unie */
.card.flat { padding: 0; }
.mark { position: absolute; left: 0; width: 1px; height: 1px; pointer-events: none; }
.card + .card { margin-top: 12px; }
.card h3 { margin: 0; font: 600 17px/1.25 var(--font); letter-spacing: -.012em; }
.divider { height: 1px; background: var(--line); margin: 14px 0; border: 0; }

.icon-btn {
  position: relative;
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px;
  background: var(--glass); color: var(--text);
  -webkit-backdrop-filter: blur(14px) saturate(180%);
  backdrop-filter: blur(14px) saturate(180%);
  box-shadow: var(--optics), var(--float-sm);
  transition: background .3s, transform .9s var(--liquid), opacity .2s;
}
.icon-btn:hover { background: var(--glass-press); }
.icon-btn:active:not(:disabled) { transform: scale(1.1); transition: background .1s, transform .18s var(--ease-out); }
.icon-btn:disabled svg { opacity: .32; }
.icon-btn.ghost { background: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.icon-btn.ghost::after { display: none; }
.icon-btn.ghost:active:not(:disabled) { background: var(--field); transform: scale(.92); }
.icon-btn.sm { width: 34px; height: 34px; }

/* ============================================================== buttons */
.btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 50px; padding: 0 22px; border-radius: 999px;
  font-weight: 600; font-size: 15.5px; letter-spacing: -.005em;
  transition: transform .9s var(--liquid), background .2s, box-shadow .25s, opacity .15s;
  white-space: nowrap;
}
.btn:active:not(:disabled) { transform: scale(1.02, .92); transition: transform .16s var(--ease-out), box-shadow .2s; }
/* le violet : un verre teinté, seul accent de l'interface */
.btn.primary { background: var(--accent-grad); color: var(--on-accent); box-shadow: var(--accent-shadow); }
.btn.primary::after { background: linear-gradient(160deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, .14) 34%, transparent 58%, rgba(255, 255, 255, .28)); }
.btn.secondary { background: var(--field); color: var(--text); box-shadow: var(--field-shadow); }
.btn.secondary:hover { background: var(--field-hover); }
.btn.ghost { background: transparent; color: var(--text-2); }
.btn.danger { background: transparent; color: var(--neg); }
.btn.block { width: 100%; }
.btn.sm { height: 38px; padding: 0 16px; font-size: 14px; }
.btn:disabled { opacity: .38; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
  border-radius: 999px; background: var(--field); color: var(--text-2);
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
}
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* segmented control : une lentille glisse d'une option à l'autre (--i, --n posés par le script)
   et s'étire comme une goutte pendant le trajet (.move) */
.seg {
  position: relative; isolation: isolate;
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px;
  padding: 3px; border-radius: 999px; background: var(--field); box-shadow: var(--field-shadow); overflow: hidden;
}
.seg button {
  height: 38px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--text-2);
  transition: background .15s, color .25s var(--ease-out);
}
.seg button[aria-pressed="true"] { color: var(--text); }
.seg:not(.thumb) button[aria-pressed="true"] { background: var(--thumb); box-shadow: var(--thumb-shadow); }
.seg.thumb::before {
  content: ''; position: absolute; z-index: -1; top: 3px; bottom: 3px; left: 3px;
  width: calc((100% - 6px - (var(--n) - 1) * 3px) / var(--n));
  transform: translateX(calc(var(--i) * (100% + 3px)));
  border-radius: 999px; background: var(--thumb);
  box-shadow: var(--thumb-shadow);
  transition: transform .85s var(--liquid-soft), opacity .25s, scale .25s var(--ease-out);
}
.seg.thumb.move::before { animation: droplet .85s ease-in-out; }
/* la goutte s'étire dans le sens du trajet, se tasse à l'arrivée puis se pose */
@keyframes droplet { 18% { scale: 1.24 .84; } 42% { scale: .93 1.07; } 62% { scale: 1.04 .97; } 82% { scale: .99 1.01; } }
.seg.thumb.none::before { opacity: 0; scale: .9; }
.seg.tall { border-radius: 24px; }
.seg.tall button, .seg.tall.thumb::before { border-radius: 21px; }
.seg.tall button { height: 54px; display: grid; align-content: center; gap: 1px; line-height: 1.2; }
.seg.tall button small { font-size: 12px; color: var(--text-3); font-weight: 400; }
.seg.scale button { font-variant-numeric: tabular-nums; }
.seg.scale.thumb::before { background: var(--accent-grad); box-shadow: var(--accent-shadow); }
.seg.scale button[aria-pressed="true"] { color: var(--on-accent); }
.seg.scale:not(.thumb) button[aria-pressed="true"] { background: var(--accent); box-shadow: none; }

/* ============================================================== tab bar */
/* capsule de verre aux icônes seules ; la pastille active est dessinée par le moteur */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 32;
  padding: 0 var(--gutter) var(--nav-b);
  pointer-events: none;
}
.tabbar nav {
  pointer-events: auto;
  position: relative; max-width: 420px; margin: 0 auto; height: var(--nav-h); padding: 0 6px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-radius: 999px; overflow: hidden;
  background: var(--glass);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  backdrop-filter: blur(16px) saturate(180%);
  box-shadow: var(--optics), var(--float);
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
.gl .tabbar nav { touch-action: none; overflow: visible; }
.tabbar .ind {
  position: absolute; top: 5px; bottom: 5px; left: 6px; width: calc((100% - 12px) / 4); pointer-events: none;
  transform: translateX(calc(var(--i, 0) * 100%));
  transition: transform .9s var(--liquid-soft);
}
.gl .tabbar .ind { display: none; }
.tabbar .ind::before {
  content: ''; position: absolute; inset: 0;
  border-radius: 999px; background: var(--thumb); box-shadow: var(--thumb-shadow);
}
.tabbar .ind.move::before { animation: stretch .9s ease-in-out; }
@keyframes stretch { 16% { transform: scale(1.38, .82); } 38% { transform: scale(.9, 1.08); } 58% { transform: scale(1.05, .96); } 78% { transform: scale(.98, 1.02); } }
.tabbar button {
  position: relative; z-index: 1;
  display: grid; place-items: center;
  color: var(--text); opacity: .74;
  border-radius: 999px;
  transition: opacity .25s, transform .9s var(--liquid);
}
.tabbar button .icon { width: 25px; height: 25px; }
.tabbar button:active { transform: scale(1.1); transition: opacity .25s, transform .18s var(--ease-out); }
.tabbar button[aria-current="page"] { opacity: 1; }
.tabbar button.pop .icon { animation: tabPop .9s var(--liquid); }
@keyframes tabPop { from { transform: scale(.68); } }
.tabbar .live { position: relative; display: block; }
.tabbar .live::before, .tabbar .live::after {
  content: ''; position: absolute; top: -2px; right: -5px; width: 8px; height: 8px; border-radius: 99px;
  background: var(--accent-ink);
}
/* l'onde autour du point : agrandie et non redessinée, elle ne sollicite pas le processeur */
.tabbar .live::before { background: var(--accent-line); animation: live 2s var(--ease-out) infinite; }
@keyframes live { 0% { transform: scale(1); opacity: 1; } 70%, 100% { transform: scale(2.75); opacity: 0; } }
.sheet-open .tabbar button { opacity: 0; pointer-events: none; transition: opacity .16s; }
.sheet-open .tabbar nav { pointer-events: none; }
.sheet-open .dock, .sheet-open .save-bar { opacity: 0; pointer-events: none; transition: opacity .16s; }
.sheet-open .dock *, .sheet-open .save-bar * { pointer-events: none !important; }
.dock, .save-bar { transition: opacity .25s; }
.sheet-open .page-head { opacity: .42; transition: opacity .25s; }
.sheet-open .page-head > * { pointer-events: none; }
.page-head { transition: opacity .25s; }

/* ============================================================== état de synchro (dans l'en-tête) */
.sync {
  position: relative; flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; font-weight: 500; color: var(--text-2);
}
.sync i { width: 7px; height: 7px; border-radius: 99px; background: var(--pos); transition: background .3s; }
.sync.saving i { background: var(--warn); animation: pulse 1s infinite; }
.sync.error i, .sync.offline i { background: var(--neg); }
@keyframes pulse { 50% { opacity: .35; } }

/* ============================================================== home */
.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 14px; }
.wday {
  display: grid; justify-items: center; gap: 6px; padding: 9px 0 10px; border-radius: 18px;
  color: var(--text-2);
}
.wday .d { font-size: 12px; font-weight: 500; color: var(--text-3); }
.wday .n { font: 600 17px/1 var(--font); font-variant-numeric: tabular-nums; color: var(--text); }
.wday .dot { width: 6px; height: 6px; border-radius: 99px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.wday.planned .dot { box-shadow: inset 0 0 0 1.5px var(--text-3); }
.wday.done .dot { background: var(--accent-ink); box-shadow: 0 0 0 3px var(--accent-soft); }
.wday.today { background: var(--thumb); box-shadow: var(--thumb-shadow); }
.wday.today .d { color: var(--text); }
.wday.past:not(.today) .n { color: var(--text-2); }

.hero { padding: 21px 19px 19px; }
.hero h2 { margin: 6px 0 4px; font: 600 30px/1.08 var(--font); letter-spacing: -.024em; }
.hero .detail { color: var(--text-2); font-size: 15px; }
.hero .meta { display: flex; gap: 22px; margin: 18px 0 18px; }
.hero .meta div { display: grid; gap: 2px; }
.hero .meta strong { font: 600 19px/1.1 var(--font); letter-spacing: -.01em; }
.hero .meta span { font-size: 12.5px; color: var(--text-3); }
.ex-preview { display: grid; gap: 0; margin: 2px 0 18px; border-top: 1px solid var(--line); }
.ex-preview div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.ex-preview div span:last-child { color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.kpi { padding: 15px 15px 14px; display: grid; gap: 6px; align-content: start; border-radius: 24px; }
.kpi .value { font: 600 27px/1.05 var(--font); letter-spacing: -.022em; font-variant-numeric: tabular-nums; }
.kpi .value small { font: 400 13px var(--font); color: var(--text-3); margin-left: 3px; letter-spacing: 0; }
.kpi .foot { font-size: 13px; color: var(--text-2); }
.delta.up { color: var(--pos); }
.delta.down { color: var(--neg); }
.kpis .card + .card { margin-top: 0; }

/* minuteur de récupération : goutte qui sort de la capsule d'onglets (le col est dessiné par le moteur) */
.dock, .save-bar {
  position: fixed; left: 0; right: 0; z-index: 32;
  bottom: calc(var(--nav-h) + var(--nav-b) + var(--glass-gap));
  display: flex; justify-content: center; padding: 0 var(--gutter); pointer-events: none;
  transform-origin: 50% 100%;
}
html:not(.gl) .dock, html:not(.gl) .save-bar { animation: emerge 1.2s var(--liquid), fadein .14s linear; }
html:not(.gl) .dock.out, html:not(.gl) .save-bar.out { animation: sink .26s var(--ease-in) forwards; }
.gl .dock > *, .gl .save-bar > * { animation: dockText .42s var(--ease-out) .16s backwards; }
.gl .dock.out > *, .gl .save-bar.out > * { opacity: 0; transition: opacity .1s linear; animation: none; }
@keyframes dockText { from { opacity: 0; } }
@keyframes emerge { from { transform: translateY(54px) scale(.36, .5); } }
@keyframes sink { to { transform: translateY(46px) scale(.5, .6); opacity: 0; } }
.timer {
  position: relative; pointer-events: auto; width: 100%; max-width: 420px;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
  padding: 8px 8px 8px 9px; border-radius: 999px;
  background: var(--glass-strong); color: var(--text);
  -webkit-backdrop-filter: blur(18px) saturate(180%);
  backdrop-filter: blur(18px) saturate(180%);
  box-shadow: var(--optics), var(--float);
}
.timer .ring { width: 44px; height: 44px; }
.timer .ring circle { fill: none; stroke-width: 3.5; }
.timer .ring .track { stroke: var(--field); }
.timer .ring .val { stroke: var(--accent-ink); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; } /* pas de transition : l'anneau bouge d'une fraction de pixel 4 fois par seconde, et ne force plus 60 dessins par seconde */
.timer .t { font: 600 23px/1 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.timer .lab { font-size: 12.5px; color: var(--text-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer .ctl { display: flex; gap: 6px; }
.timer .ctl button {
  height: 42px; min-width: 46px; padding: 0 11px; border-radius: 999px; font-weight: 600; font-size: 13.5px;
  background: var(--field); color: var(--text); font-variant-numeric: tabular-nums;
  display: grid; place-items: center; position: relative;
  transition: background .15s, transform .9s var(--liquid);
}
.timer .ctl button:active { transform: scale(1.12); background: var(--field-hover); transition: background .1s, transform .18s var(--ease-out); }
html:not(.gl) .timer.ended { animation: ring 1s var(--ease-out) 2; }
@keyframes ring { 30% { transform: scale(1.035); box-shadow: 0 0 0 8px var(--accent-soft), var(--float); } }

/* ============================================================== journal */
.field-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; padding: 13px 0; }
.field-row + .field-row, .field-block + .field-row, .field-row + .field-block, .field-block + .field-block { border-top: 1px solid var(--line); }
.field-row label, .field-block > label { font-size: 15px; font-weight: 500; }
.field-row .hint, .field-block .hint { display: block; font-size: 12.5px; color: var(--text-3); font-weight: 400; margin-top: 1px; }
.field-block { display: grid; gap: 10px; padding: 13px 0; }
.input-unit { display: flex; align-items: center; height: 44px; border-radius: 16px; background: var(--field); box-shadow: var(--field-shadow); padding: 0 14px 0 4px; transition: box-shadow .2s; }
.input-unit input {
  width: 84px; height: 100%; border: 0; background: transparent; outline: none; text-align: right;
  font: 600 17px var(--font); font-variant-numeric: tabular-nums; padding-right: 6px;
}
.input-unit span { font-size: 13px; color: var(--text-3); }
.input-unit:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent-line); }
textarea.note {
  width: 100%; min-height: 96px; resize: vertical; border: 0; border-radius: 20px; padding: 12px 14px;
  background: var(--field); box-shadow: var(--field-shadow); outline: none; line-height: 1.5; transition: box-shadow .2s;
}
textarea.note::placeholder { color: var(--text-3); }
textarea.note:focus { box-shadow: inset 0 0 0 1.5px var(--accent-line); }
.choice { display: flex; flex-wrap: wrap; gap: 6px; }
.choice button {
  height: 38px; padding: 0 16px; border-radius: 999px; background: var(--field); box-shadow: var(--field-shadow); color: var(--text-2); font-size: 14px; font-weight: 500;
  position: relative;
  transition: background .25s var(--ease-out), color .2s, transform .9s var(--liquid), box-shadow .25s;
}
.choice button:active { transform: scale(1.05, .9); transition: transform .14s var(--ease-out); }
.choice button[aria-pressed="true"] { background: var(--accent-grad); color: var(--on-accent); box-shadow: var(--accent-shadow); animation: pop .8s var(--liquid); }
.save-bar .btn { pointer-events: auto; width: 100%; max-width: 420px; height: 54px; }
.gl .save-bar .btn { color: var(--on-accent); }
.mini-week { display: grid; gap: 0; }
.mini-week .r { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14px; }
.mini-week .r:first-child { border-top: 0; }
.mini-week .r.sel { color: var(--text); }
.mini-week .r.sel .d { color: var(--text); font-weight: 600; }
.mini-week .r .d { color: var(--text-2); font-size: 13px; }
.mini-week .r .w { font-variant-numeric: tabular-nums; color: var(--text-2); }
/* ============================================================== sheet (modale bas) */
/* la capsule d'onglets s'étire jusqu'à devenir la feuille : le verre est dessiné par le moteur */
.backdrop {
  position: fixed; inset: 0; z-index: 29; background: var(--scrim);
  animation: fadein .3s var(--ease-out);
}
html:not(.gl) .backdrop { z-index: 33; }
@keyframes fadein { from { opacity: 0; } }
.sheet {
  position: fixed; left: 8px; right: 8px; bottom: max(8px, calc(var(--sab) - 16px)); z-index: 34;
  max-height: calc(100vh - var(--sat) - 10px - var(--head-h) - var(--glass-gap) - 10px); overflow-y: auto; overscroll-behavior: none;
  margin: 0 auto; max-width: 544px;
  background: var(--glass-strong);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  border-radius: 36px;
  padding: 10px 20px 22px;
  box-shadow: var(--optics), 0 30px 70px -20px rgba(0, 0, 0, .55);
  transform-origin: 50% 100%;
}
html:not(.gl) .sheet { animation: up .8s var(--liquid-soft); }
@keyframes up { from { transform: translateY(calc(100% + 48px)) scale(.94, 1.05); } }
.gl .sheet > * { animation: sheetBody .5s var(--ease-out) .1s backwards; }
@keyframes sheetBody { from { opacity: 0; transform: translateY(14px); } }
.gl .sheet.closing > * { opacity: 0; transition: opacity .12s linear; animation: none; }
.sheet.closing, .backdrop.closing { pointer-events: none; }
.sheet-x { position: absolute; top: 14px; right: 14px; background: var(--field); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.sheet-x::after { display: none; }
.sheet h2 { padding-right: 44px; }
.sheet .grab { width: 38px; height: 5px; border-radius: 9px; background: var(--line-2); margin: 0 auto 14px; }
.sheet h2 { margin: 0 0 4px; font: 600 23px/1.18 var(--font); letter-spacing: -.018em; }
.sheet .sub { color: var(--text-2); font-size: 14.5px; margin-bottom: 18px; }
.sheet-text { margin: -6px 0 0; color: var(--text-2); font-size: 14.5px; line-height: 1.45; }
.sheet .actions { display: grid; gap: 8px; margin-top: 20px; }
.sheet .swap-in > * { animation: sheetSwap .35s var(--ease-out) backwards; }
@keyframes sheetSwap { from { opacity: 0; transform: translateX(16px); } }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat3 div { padding: 12px 13px; border-radius: 20px; background: var(--field); display: grid; gap: 3px; }
.stat3 b { font: 600 20px/1.1 var(--font); }
.stat3 span { font-size: 12.5px; color: var(--text-3); font-weight: 500; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; }
.switch { position: relative; width: 54px; height: 32px; border-radius: 99px; background: var(--field-hover); transition: background .3s var(--ease-out); flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 99px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.04); transition: transform .85s var(--liquid); }
.switch.move::after { animation: droplet .85s ease-in-out; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.hist { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13.5px; }
.hist td, .hist th { padding: 9px 0; border-top: 1px solid var(--line); text-align: left; }
.hist th { color: var(--text-3); font-weight: 500; font-size: 12.5px; border-top: 0; }
.hist td:first-child { color: var(--text-2); width: 56px; }
.hist td:last-child { text-align: right; color: var(--text-2); }

/* ============================================================== toast + états */
/* notification : goutte qui tombe de la carte d'en-tête, puis y remonte */
.toast {
  position: fixed; left: 50%; z-index: 36; top: calc(var(--sat) + 10px + var(--head-h) + var(--glass-gap)); transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 40px); display: flex; align-items: center; gap: 12px;
  min-height: 48px; padding: 11px 20px; border-radius: 24px; background: var(--glass-strong); color: var(--text);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  font-size: 14px; font-weight: 500; box-shadow: var(--optics), var(--float);
  transform-origin: 50% 0;
}
html:not(.gl) .toast { animation: drop .9s var(--liquid), fadein .15s linear; }
html:not(.gl) .toast.out { animation: lift .22s var(--ease-in) forwards; }
.gl .toast { animation: dockText .36s var(--ease-out) .12s backwards; }
.gl .toast.out { opacity: 0; transition: opacity .12s linear; animation: none; }
html:not(.gl) .toast.error { background: color-mix(in srgb, var(--neg) 88%, transparent); }
.toast.error { color: #fff; }
.toast button { font-weight: 700; color: var(--accent-ink); }
.toast.error button { color: inherit; text-decoration: underline; }
@keyframes drop { from { transform: translate(-50%, -14px) scale(.32, .5); } }
@keyframes lift { to { transform: translate(-50%, -16px) scale(.96); opacity: 0; } }
.empty-state { text-align: center; padding: 42px 24px; color: var(--text-2); }
.empty-state h3 { color: var(--text); margin-bottom: 6px; }
.splash { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
.splash .logo { font: 700 22px var(--font); letter-spacing: -.03em; }
.splash p { color: var(--text-2); max-width: 340px; }
.brand { display: inline-flex; align-items: center; gap: 8px; font: 600 16px var(--font); letter-spacing: -.02em; }
.brand i { width: 9px; height: 9px; border-radius: 99px; background: var(--accent-ink); }

/* ============================================================== mouvement */
/* Transitions entre écrans : l'ancien écran (copie figée) s'efface pendant que le nouveau entre. */
.leaving { position: fixed; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none; }
.leaving.g-r { animation: gR .18s var(--ease-in) forwards; }
.leaving.g-l { animation: gL .18s var(--ease-in) forwards; }
.leaving.g-up { animation: gUp .18s var(--ease-in) forwards; }
.leaving.g-down { animation: gDown .2s var(--ease-in) forwards; }
.leaving.g-fade { animation: gFade .16s linear forwards; }
@keyframes gR { to { opacity: 0; transform: translateX(-32px); } }
@keyframes gL { to { opacity: 0; transform: translateX(32px); } }
@keyframes gUp { to { opacity: 0; transform: scale(.94); } }
@keyframes gDown { to { opacity: 0; transform: translateY(56px); } }
@keyframes gFade { to { opacity: 0; } }

/* Apparition au défilement : chaque bloc monte et se pose comme une goutte, avec un léger rebond. */
.rv:not(.in) { opacity: 0; }
/* le fondu s'arrête vite : un bloc en cours de fondu coûte bien plus cher qu'un bloc qui bouge */
.rv.in { animation: rvIn 1s var(--liquid-soft) var(--d, 0ms) backwards, rvFade .32s linear var(--d, 0ms) backwards; }
@keyframes rvIn { from { transform: translate3d(var(--rx, 0px), var(--ry, 26px), 0) scale(.95, .97); } }
@keyframes rvFade { from { opacity: 0; } }
.view.t-up .progress b { animation: growIn 1.1s var(--ease-out) .3s backwards; }
@keyframes growIn { from { transform: translateX(0); } }

/* barres, jauges et listes en cascade dans un bloc qui apparaît */
.rv:not(.in) .fill { transform: translateX(0); }
.rv.in .fill { transition: transform 1.5s var(--liquid) calc(var(--d, 0ms) + 200ms); }
.rv:not(.in) .cmp td .bar.fill { width: 0; }
.rv.in .cmp td .bar.fill { transition: width 1.5s var(--liquid) calc(var(--d, 0ms) + 200ms); }
.rv:not(.in) .wday, .rv:not(.in) .wk, .rv:not(.in) .ex-preview div { opacity: 0; transform: translateY(8px); }
.rv:not(.in) .wk { transform: translateX(16px); }
.rv.in .wday, .rv.in .wk, .rv.in .ex-preview div {
  transition: opacity .5s var(--ease-out), transform .95s var(--liquid);
  transition-delay: calc(var(--d, 0ms) + 120ms + var(--i, 0) * 45ms);
}
.rv:not(.in) .wday.done .dot { transform: scale(0); }
.rv.in .wday.done .dot { transition: transform .55s var(--spring) calc(var(--d, 0ms) + 380ms + var(--i, 0) * 45ms); }
.rv:not(.in) .meter .tgt { opacity: 0; }
.rv.in .meter .tgt { transition: opacity .4s ease calc(var(--d, 0ms) + 900ms), left .7s var(--ease-out); }

/* graphiques : le liquide monte et épouse la courbe (script), puis le dernier point se pose avec une onde */
.rv:not(.in) .series, .rv:not(.in) .area { opacity: 0; }
.rv:not(.in) .grid line, .rv:not(.in) .axis text, .rv:not(.in) .ref { opacity: 0; }
.rv.in .grid line, .rv.in .axis text, .rv.in .ref { transition: opacity .6s ease calc(var(--d, 0ms) + 100ms); }
.rv:not(.in) .end, .rv:not(.in) .end-label { opacity: 0; transform: scale(.2); }
.rv.in .end, .rv.in .end-label { transition: opacity .25s ease calc(var(--d, 0ms) + 1.6s), transform .9s var(--liquid) calc(var(--d, 0ms) + 1.6s); }
.end-label { transform-box: fill-box; transform-origin: left center; }
.rv.in .halo { animation: halo 1.4s var(--ease-out) calc(var(--d, 0ms) + 1.7s) forwards; }
@keyframes halo { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(4.5); } }

/* passage d'un état à l'autre sans animation (le script repart de l'ancienne valeur) */
.snap, .snap::before { transition: none !important; }

/* changement de thème en fondu */
.theming, .theming *, .theming *::before, .theming *::after {
  transition: background-color .4s ease, border-color .4s ease, color .4s ease, fill .4s ease, stroke .4s ease, transform .5s var(--ease-out) !important;
}

@media (min-width: 720px) {
  .view { padding-top: calc(var(--sat) + 20px + var(--head-h) + 24px); }
  .page-head { top: calc(var(--sat) + 20px); }
  .toast { top: calc(var(--sat) + 20px + var(--head-h) + var(--glass-gap)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ============================================================== Grind : écrans */
h1, h2, h3 { margin: 0; }
b { font-weight: 600; }
p { margin: 0 0 10px; }
.small { font-size: 13px; }
.neg, .low, .high { color: var(--warn); }
.ok { color: var(--pos); }
.view.has-dock { padding-bottom: calc(var(--nav-h) + var(--nav-b) + 124px); }
.view > * + * { margin-top: 12px; }
.view > .card + .card { margin-top: 12px; }
.view > .btn.block + .btn.block { margin-top: 8px; }
.card > p:last-child { margin-bottom: 0; }

.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h2 { font: 600 17px/1.25 var(--font); letter-spacing: -.012em; min-width: 0; }
.card-head .muted.small { font-size: 12.5px; }
.chip.chip-on { background: var(--accent-soft); color: var(--accent-ink); }
.link { font-size: 13.5px; font-weight: 600; color: var(--accent-ink); }
.card .btn.block { margin-top: 14px; }
.card .btn.block + .btn.block { margin-top: 8px; }
.btn.soft { background: var(--field); color: var(--text); box-shadow: var(--field-shadow); }
.btn.soft:hover { background: var(--field-hover); }
.btn .icon { width: 19px; height: 19px; }

/* en-tête : sous-titre en ligne, état de synchro discret */
.ph-sub b { color: var(--text); font-weight: 600; }
.ph-card .sync span { white-space: nowrap; }
.ph-card .sync.ok span { display: none; }

/* tuiles du jour : petites cartes de verre */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile {
  position: relative; isolation: isolate; overflow: hidden; overflow: clip; contain: layout;
  border: 1px solid transparent;
  background: linear-gradient(var(--card-base), var(--card-base)) padding-box, var(--rim) border-box;
  border-radius: 22px; box-shadow: var(--lift);
  padding: 13px 12px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0;
}
.tile::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: var(--card-glow); }
.tile-label { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.tile-value { font: 600 24px/1.1 var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile-value small { font: 400 12px var(--font); color: var(--text-3); margin-left: 3px; letter-spacing: 0; }
.tile-note { font-size: 11.5px; color: var(--text-2); line-height: 1.3; }

.ex-list { margin: 4px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.ex-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.ex-list li span:last-child { color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ex-list li:last-child { border-bottom: 0; }

.row-link { display: flex; width: 100%; align-items: center; gap: 12px; padding: 13px 0 0; margin-top: 12px; border-top: 1px solid var(--line); text-align: left; transition: transform .4s var(--spring); }
.row-link:active { transform: scale(.98); }
.row-link span:first-child { font-weight: 600; }
.row-link .muted { flex: 1; text-align: right; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.row-link .badge { width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; background: var(--thumb); box-shadow: var(--thumb-shadow); flex: none; }

/* champs */
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.field { display: grid; gap: 7px; margin-bottom: 10px; min-width: 0; }
.field-label { font-size: 13px; font-weight: 500; color: var(--text-2); margin: 0 2px; }
.field-hint { font-size: 12.5px; color: var(--text-3); margin: 0 2px; }
.field-box {
  display: flex; align-items: center; height: 46px; border-radius: 16px; background: var(--field); box-shadow: var(--field-shadow);
  padding: 0 14px; transition: box-shadow .2s, background .2s; min-width: 0;
}
.field-box:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent-line); background: var(--card-2); }
.field-box input { flex: 1; min-width: 0; width: 100%; height: 100%; border: 0; background: transparent; outline: none; font: 600 17px var(--font); font-variant-numeric: tabular-nums; padding: 0; }
.field-box input::placeholder, .input::placeholder, .field textarea::placeholder { color: var(--text-3); font-weight: 500; }
.unit { color: var(--text-3); font-size: 13px; margin-left: 6px; flex: none; }
.field textarea, textarea.input {
  width: 100%; min-height: 88px; resize: vertical; border: 0; border-radius: 20px; padding: 12px 14px;
  background: var(--field); box-shadow: var(--field-shadow); outline: none; line-height: 1.5; transition: box-shadow .2s;
}
.field textarea:focus, textarea.input:focus { box-shadow: inset 0 0 0 1.5px var(--accent-line); }
.input {
  width: 100%; height: 46px; border: 0; border-radius: 16px; background: var(--field); box-shadow: var(--field-shadow);
  padding: 0 14px; font-size: 16px; font-weight: 500; outline: none; transition: box-shadow .2s; -webkit-appearance: none; appearance: none;
}
.input:focus { box-shadow: inset 0 0 0 1.5px var(--accent-line); }
input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

/* notes 0 à 5 : contrôle segmenté dont la pastille accentuée glisse d'une note à l'autre */
.rating { padding: 13px 0 12px; border-top: 1px solid var(--line); }
.rating-head { font-size: 14.5px; font-weight: 500; margin: 0 2px 9px; }
.rating-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-3); margin: 7px 4px 0; }
.seg.scale button { font-weight: 600; font-variant-numeric: tabular-nums; }
.seg.scale.s11 { gap: 1px; padding: 3px; }
.seg.scale.s11 button { font-size: 13px; }
.seg.scale.s11.thumb::before { width: calc((100% - 6px - (var(--n) - 1) * 1px) / var(--n)); transform: translateX(calc(var(--i) * (100% + 1px))); }

/* pastilles et choix */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.chips .pill, .choice-pill {
  height: 38px; padding: 0 16px; border-radius: 999px; background: var(--field); box-shadow: var(--field-shadow); color: var(--text-2); font-size: 14px; font-weight: 500;
  position: relative; transition: background .25s var(--ease-out), color .2s, transform .9s var(--liquid), box-shadow .25s;
}
.chips .pill:active { transform: scale(1.05, .9); transition: transform .14s var(--ease-out); }
.chips .pill.on { background: var(--accent-grad); color: var(--on-accent); box-shadow: var(--accent-shadow); animation: pop .8s var(--liquid); }
.pills { display: inline-grid; grid-auto-flow: column; gap: 2px; padding: 3px; border-radius: 999px; background: var(--field); box-shadow: var(--field-shadow); }
.pills .pill { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--text-2); transition: background .2s, color .2s; }
.pills .pill.on { background: var(--thumb); box-shadow: var(--thumb-shadow); color: var(--text); }

/* listes */
.list { list-style: none; margin: 0; padding: 0; }
.list-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 18px 4px 4px; }
.food-row, .entry, .hist-row {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; text-align: left;
  padding: 11px 4px; border-top: 1px solid var(--line); transition: background .15s;
}
.list li:first-child > .food-row, .list li:first-child.hist-row, .entries li:first-child > .entry { border-top: 0; }
.food-row:active, .entry:active { background: var(--card-2); }
.entry-name { font-size: 14.5px; font-weight: 500; }
.food-row .muted.small, .entry .muted.small, .hist-row .muted.small { font-size: 12.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.entries { list-style: none; margin: -4px 0 0; padding: 0; }
.meal-actions, .tool-row { display: flex; gap: 8px; flex-wrap: wrap; }
.meal-actions { margin-top: 10px; }
.meal-actions .btn, .tool-row .btn { height: 40px; padding: 0 16px; font-size: 14px; }
.tool-row .btn { flex: 1 1 auto; }

/* feuilles : titre, recherche, actions rapides */
.sheet .sheet-title { margin: 0 0 16px; padding-right: 44px; font: 600 23px/1.18 var(--font); letter-spacing: -.018em; }
.sheet-body > p { color: var(--text-2); }
.search { margin-bottom: 12px; }
.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
.qa {
  position: relative; display: grid; justify-items: center; gap: 7px; padding: 12px 4px 11px; border-radius: 20px;
  background: var(--field); box-shadow: var(--field-shadow); font-size: 12px; font-weight: 500; color: var(--text-2);
  transition: transform .9s var(--liquid), background .2s;
}
.qa:active { transform: scale(1.06, .92); transition: transform .14s var(--ease-out); }
.qa .ic { width: 38px; height: 38px; border-radius: 999px; display: grid; place-items: center; background: var(--thumb); box-shadow: var(--thumb-shadow); color: var(--text); }
.qa .icon { width: 19px; height: 19px; }
.preview { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; padding: 12px 14px; margin: 4px 0 12px; border-radius: 18px; background: var(--field); font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.preview:empty { display: none; }
.preview b { color: var(--text); font-size: 17px; }
.qty-input { font-size: 22px !important; }
.grow { flex: 1; }
.ing { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); }
.ing .entry-name { flex: 1; min-width: 0; }
.ing input { width: 76px; height: 38px; border: 0; border-radius: 12px; background: var(--field); padding: 0 10px; text-align: right; font: 600 15px var(--font); outline: none; }

/* scanner */
.scan-box { position: relative; aspect-ratio: 4 / 3; border-radius: 24px; overflow: hidden; background: #000; margin-bottom: 10px; }
.scan-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan-frame { position: absolute; left: 12%; right: 12%; top: 32%; bottom: 32%; border-radius: 16px; box-shadow: 0 0 0 999px rgba(0, 0, 0, .38), inset 0 0 0 2px rgba(255, 255, 255, .9); }
.scan-frame::after { content: ''; position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; border-radius: 2px; background: var(--accent-ink); box-shadow: 0 0 12px var(--accent-glow); animation: scanline 1.8s ease-in-out infinite alternate; }
@keyframes scanline { from { transform: translateY(-26px); } to { transform: translateY(26px); } }
.scan-status { position: absolute; left: 0; right: 0; bottom: 10px; margin: 0; text-align: center; color: #fff; font-size: 13px; text-shadow: 0 1px 3px #000; padding: 0 12px; }
.scan-box.off { aspect-ratio: auto; background: var(--field); }
.scan-box.off video, .scan-box.off .scan-frame { display: none; }
.scan-box.off .scan-status { position: static; color: var(--text-2); text-shadow: none; padding: 16px; }
.file-btn { cursor: pointer; }
.manual { display: flex; gap: 8px; margin-top: 10px; }
.manual .btn { flex: none; height: 46px; }

/* nutrition : anneau des kcal et barres de macros */
.food-summary { display: flex; align-items: center; gap: 18px; }
.ring-wrap { position: relative; width: 120px; height: 120px; flex: none; }
.ring-wrap .ring { width: 100%; height: 100%; }
.ring-bg { fill: none; stroke: var(--field); stroke-width: 11; }
.ring-fg { fill: none; stroke: var(--accent-ink); stroke-width: 11; stroke-linecap: round; transition: stroke-dasharray 1.2s var(--liquid-soft); filter: drop-shadow(0 0 6px var(--accent-glow)); }
.ring-fg.over { stroke: var(--warn); filter: none; }
.ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-text b { font: 600 25px/1.05 var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ring-text span { font-size: 11.5px; color: var(--text-3); max-width: 84px; line-height: 1.25; margin-top: 2px; }
.macros { flex: 1; min-width: 0; display: grid; gap: 11px; }
.macro-head { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 500; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.macro-head .muted { font-size: 12.5px; font-weight: 400; }
.macro-track { height: 6px; border-radius: 6px; background: var(--field); overflow: hidden; }
.macro-fill { height: 100%; border-radius: 6px; transition: width 1.2s var(--liquid); }
.m-p { background: var(--m-p); } .m-c { background: var(--m-c); } .m-f { background: var(--m-f); }
.meal .card-head { margin-bottom: 6px; }

/* séance */
.ex-card .card-head { align-items: flex-start; flex-wrap: nowrap; }
.ex-title { text-align: left; min-width: 0; }
.ex-title h2 { font: 600 17px/1.3 var(--font); letter-spacing: -.012em; }
.cue { margin: 0 0 10px; padding: 11px 14px; border-radius: 18px; background: var(--card-2); font-size: 13.5px; line-height: 1.5; color: var(--text-2); }
.cue summary { cursor: pointer; font-weight: 600; color: var(--text); list-style: none; }
.cue summary::-webkit-details-marker { display: none; }
.cue summary::after { content: ' ›'; color: var(--text-3); }
.cue[open] summary::after { content: ' ⌄'; }
.cue p { margin: 6px 0; animation: fadein .3s var(--ease-out); }
.cue a { color: var(--accent-ink); font-weight: 600; text-decoration: none; margin-right: 10px; }
.tip { display: inline-flex; margin: 2px 0 8px; padding: 6px 12px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-ink); font-size: 13px; font-weight: 500; line-height: 1.35; }
.sets { display: grid; gap: 2px; margin: 10px -6px 6px; }
.set-row { display: grid; grid-template-columns: 26px 1fr 1fr 46px; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 22px; transition: background .3s var(--ease-out); }
.set-row .field-box { height: 44px; padding: 0 12px; }
.set-row input { text-align: center; }
.set-n { font: 600 14px var(--font); color: var(--text-2); text-align: center; font-variant-numeric: tabular-nums; transition: color .3s; }
.check {
  width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center;
  background: var(--field); box-shadow: var(--field-shadow); color: var(--text-3); position: relative;
  transition: background .25s var(--ease-out), color .2s, transform .9s var(--liquid), box-shadow .25s;
}
.check:active { transform: scale(1.12, .86); transition: transform .14s var(--ease-out); }
.check .icon { width: 20px; height: 20px; stroke-width: 2.4; }
.set-row.done { background: var(--accent-soft); }
.set-row.done .check { background: var(--accent-grad); color: var(--on-accent); box-shadow: var(--accent-shadow); }
.set-row.done .field-box { background: transparent; box-shadow: none; }
.set-row.done .set-n { color: var(--accent-ink); }
.set-row.done.just { animation: rowIn .8s var(--ease-out); }
.set-row.done.just .check { animation: pop .9s var(--liquid); }
.set-row.done.just .check path { stroke-dasharray: 1; animation: draw .42s var(--ease-out) .08s backwards; }
/* séance : choix et démarrage */
.start-card { padding-bottom: 14px; }
.pick-row { display: flex; gap: 6px; overflow-x: auto; margin: -2px -4px 14px; padding: 2px 4px; scrollbar-width: none; }
.pick-row::-webkit-scrollbar { display: none; }
.pick-row .pill {
  position: relative; flex: none; height: 34px; padding: 0 15px; border-radius: 999px; font: 600 13.5px var(--font);
  background: var(--field); box-shadow: var(--field-shadow); color: var(--text-2);
  transition: background .25s var(--ease-out), color .2s, transform .9s var(--liquid);
}
.pick-row .pill:active { transform: scale(1.05, .9); transition: transform .14s var(--ease-out); }
.pick-row .pill.on { background: var(--accent-grad); color: var(--on-accent); box-shadow: var(--accent-shadow); }
.today-dot { position: absolute; top: 4px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg); }
.pill.on .today-dot { background: var(--on-accent); box-shadow: none; }
.start-main { display: flex; align-items: center; gap: 12px; }
.start-text { flex: 1; min-width: 0; display: grid; gap: 4px; }
.start-text h2 { font: 700 26px/1.1 var(--font); letter-spacing: -.02em; }
.start-text .muted.small { line-height: 1.4; }
.start-body { flex: none; width: 74px; height: 150px; }
.start-card .btn.block { margin-top: 14px; }
.center { text-align: center; }
.start-card .center { margin-top: 8px; font-size: 12px; }

/* séance : tête d'exercice */
.ex-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
.ex-fig { flex: none; width: 44px; height: 92px; padding: 2px 0; border-radius: 14px; background: var(--card-2); display: grid; place-items: center; }
.ex-fig .body-fig { width: 38px; height: 84px; }
.ex-head-text { flex: 1; min-width: 0; display: grid; gap: 6px; justify-items: start; }
.ex-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ex-video {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px 0 11px; border-radius: 999px;
  background: var(--accent-grad); color: var(--on-accent); box-shadow: var(--accent-shadow); font: 600 13px var(--font);
  transition: transform .9s var(--liquid);
}
.ex-video:active { transform: scale(1.05, .9); transition: transform .14s var(--ease-out); }
.ex-video .icon { width: 16px; height: 16px; }

/* vidéos d'exécution */
.vid-player { margin-bottom: 12px; border-radius: 18px; overflow: hidden; background: #000; }
.vid-player video { display: block; width: 100%; max-height: 60vh; background: #000; }
.photo-add.busy { opacity: .6; pointer-events: none; }
.vid-list { margin-top: 12px; }
.vid-row { display: flex; align-items: center; gap: 6px; }
.vid-row .food-row { flex: 1; min-width: 0; }

  <script>
/*
 * App hors de Google (GitHub Pages) : remplace google.script.run par des appels au script (doPost).
 * Le lien du menu « Grind → Ouvrir l'app » donne l'adresse du script et la clé (#api=…&key=…) :
 * elles sont gardées sur le téléphone, puis effacées de la barre d'adresse.
 */
(function () {
  var KEY = 'grind:web';
  var cfg = {};
  try { cfg = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { cfg = {}; }

  /** Lit un lien de configuration (#api=…&key=…), le garde, et dit s'il était valable. */
  function link(text) {
    var m = /[#&?]api=([^&#\s]+)/.exec(text || ''), k = /[#&?]key=([0-9a-f]{32,})/i.exec(text || '');
    if (!m || !k) return false;
    var api = decodeURIComponent(m[1]);
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(api)) return false;
    cfg.api = api; cfg.key = k[1];
    try { localStorage.setItem(KEY, JSON.stringify({ api: cfg.api, key: cfg.key })); } catch (e) { /* stockage bloqué */ }
    return true;
  }
  if (location.hash && link(location.hash)) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
  }

  function call(fn, args, ok, ko) {
    var fail = function (msg, auth) {
      if (auth && cfg.onAuth) cfg.onAuth();
      if (ko) ko(new Error(msg));
    };
    if (!cfg.api || !cfg.key) { fail('App pas encore reliée au Sheet', true); return; }
    fetch(cfg.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: cfg.key, fn: fn, args: args }) })
      .then(function (r) { return r.json(); })
      .then(function (res) { if (res && res.ok) { if (ok) ok(res.result); } else fail(res && res.error || 'Erreur du serveur', res && res.auth); })
      .catch(function () { fail(navigator.onLine === false ? 'pas de réseau' : 'le script ne répond pas (déploiement : Moi / Tout le monde, nouvelle version ; lance testerApp dans l\'éditeur)'); });
  }

  var FNS = ['api_boot', 'api_sync', 'api_foodByBarcode', 'api_foodSearch', 'api_photoSave', 'api_photoGet', 'api_photoDelete', 'api_driveToken'];
  var script = {};
  Object.defineProperty(script, 'run', {
    get: function () {
      var h = {}, api = {
        withSuccessHandler: function (f) { h.ok = f; return api; },
        withFailureHandler: function (f) { h.ko = f; return api; }
      };
      FNS.forEach(function (fn) { api[fn] = function () { call(fn, Array.prototype.slice.call(arguments), h.ok, h.ko); }; });
      return api;
    }
  });
  window.google = { script: script };
  cfg.link = link;
  window.GRIND_WEB = cfg;

  // Retour du scanner externe par l'adresse de l'app (?scan=CODE&meal=…&date=…)
  var q = new URLSearchParams(location.search);
  window.BOOT = null;
  window.BOOT_ERROR = null;
  window.LAUNCH = {
    appUrl: location.origin + location.pathname, scanUrl: 'https://hontans.github.io/grind-scan/',
    scan: /^\d{8,14}$/.test(q.get('scan') || '') ? q.get('scan') : null,
    meal: q.get('meal') ? q.get('meal').slice(0, 40) : null,
    date: /^\d{4}-\d{2}-\d{2}$/.test(q.get('date') || '') ? q.get('date') : null
  };
})();
</script>

  <script>
/*
 * Thèmes de couleurs : la teinte des boutons accentués, des graphiques et du verre, et le fond généré
 * (dégradés flous et rubans de lumière) que le verre réfracte. Aucune photo : le fond est dessiné
 * au démarrage à partir des couleurs du thème, puis gardé en cache sur le téléphone.
 */
var Themes = (function () {
  // a : couleur principale, b : seconde couleur (dégradé des boutons), c : troisième couleur du fond.
  var LIST = [
    { id: 'bleu-rose', name: 'Bleu et rose', a: '#4F7BFF', b: '#F25CB4', c: '#8A5CFF' },
    { id: 'ocean', name: 'Océan', a: '#2F8CFF', b: '#22D3C5', c: '#3B4BFF' },
    { id: 'aurore', name: 'Aurore', a: '#22C49A', b: '#8A63FF', c: '#2F8CFF' },
    { id: 'sunset', name: 'Coucher de soleil', a: '#FF7A45', b: '#F2508F', c: '#FFB547' },
    { id: 'framboise', name: 'Framboise', a: '#F2508F', b: '#FF8A65', c: '#B04BFF' },
    { id: 'lavande', name: 'Lavande', a: '#7B5CFF', b: '#7B5CFF', c: '#4F7BFF' },
    { id: 'menthe', name: 'Menthe', a: '#1FBF8F', b: '#1FBF8F', c: '#1E9BD7' },
    { id: 'ambre', name: 'Ambre', a: '#F0A030', b: '#F0A030', c: '#F06A3A' },
    { id: 'glacier', name: 'Glacier', a: '#5B9BFF', b: '#5B9BFF', c: '#8FD3FF' },
    { id: 'graphite', name: 'Graphite', a: '#8C93A8', b: '#C4C9D6', c: '#5B6478' }
  ];
  var DEFAULT = 'bleu-rose';

  function get(id) { return LIST.filter(function (t) { return t.id === id; })[0] || LIST[0]; }

  function rgb(hex) { var n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function mix(c, d, t) { return [0, 1, 2].map(function (i) { return Math.round(c[i] + (d[i] - c[i]) * t); }); }
  function rgba(c, a) { return 'rgba(' + c[0] + ', ' + c[1] + ', ' + c[2] + ', ' + a + ')'; }
  function hexOf(c) { return '#' + c.map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('').toUpperCase(); }
  function lum(c) { return (c[0] * .2126 + c[1] * .7152 + c[2] * .0722) / 255; }
  var WHITE = [255, 255, 255], BLACK = [0, 0, 0];

  /** Variables CSS d'un thème pour le mode 'dark' ou 'light'. */
  function vars(t, mode) {
    var a = rgb(t.a), b = rgb(t.b), c = rgb(t.c), light = mode === 'light';
    var a1 = light ? mix(a, BLACK, .08) : a, b1 = light ? mix(b, BLACK, .08) : b;
    var mid = mix(a1, b1, .5);
    var onAccent = lum(mid) > .62 ? '#14121C' : '#FFFFFF';
    var ink = light ? mix(a, BLACK, lum(a) > .55 ? .45 : .22) : mix(a, WHITE, .5);
    var ink2 = light ? mix(b, BLACK, lum(b) > .55 ? .45 : .22) : mix(b, WHITE, .5);
    return {
      '--accent': hexOf(a1),
      '--accent-2': hexOf(b1),
      '--accent-grad': 'linear-gradient(125deg, ' + rgba(mix(a1, WHITE, .1), .95) + ' 0%, ' + rgba(b1, .95) + ' 100%)',
      '--on-accent': onAccent,
      '--accent-ink': hexOf(ink),
      '--accent-ink-2': hexOf(ink2),
      '--accent-soft': rgba(a, light ? .13 : .2),
      '--accent-line': light ? rgba(a, .38) : rgba(mix(a, WHITE, .3), .55),
      '--accent-glow': rgba(mid, light ? .4 : .55),
      '--bg': light ? hexOf(mix([234, 236, 243], c, .06)) : hexOf(mix([8, 8, 14], c, .05)),
      '--rim': light
        ? 'conic-gradient(from 212deg at 50% 50%, #fff, rgba(255, 255, 255, .75) 16%, ' + rgba(mix(b, WHITE, .75), .75) + ' 32%, rgba(255, 255, 255, .6) 50%, ' + rgba(mix(a, WHITE, .75), .75) + ' 66%, rgba(255, 255, 255, .92) 84%, #fff)'
        : 'conic-gradient(from 212deg at 50% 50%, rgba(255, 255, 255, .72), ' + rgba(mix(a, WHITE, .55), .22) + ' 16%, ' + rgba(mix(c, WHITE, .5), .1) + ' 32%, rgba(255, 255, 255, .07) 50%, ' + rgba(mix(b, WHITE, .55), .16) + ' 66%, rgba(255, 255, 255, .44) 84%, rgba(255, 255, 255, .72))'
    };
  }

  /** Teintes du verre accentué pour le moteur (rvb 0..1) : [sombre, clair]. */
  function glassTint(t) {
    var m = mix(rgb(t.a), rgb(t.b), .35);
    return [m.map(function (v) { return v / 255; }), mix(m, BLACK, .08).map(function (v) { return v / 255; })];
  }

  // ---------------------------------------------------------------- fond généré

  function rand(seed) {

  <script>
/*
 * Données de l'app et synchronisation avec le Sheet.
 *
 * - Les données arrivent avec la page (BOOT) : aucun appel serveur à l'ouverture.
 * - Chaque saisie est appliquée tout de suite en local et mise dans une file d'attente,
 *   gardée dans le téléphone (localStorage) : rien n'est perdu si le réseau coupe.
 * - La file part au serveur en UN appel (api_sync) : 15 s après la dernière saisie,
 *   quand l'app passe en arrière-plan, ou au prochain lancement.
 * - Plusieurs saisies sur le même enregistrement ne font qu'une écriture (la dernière gagne).
 */
var Store = (function () {
  var PREFIX = 'grind:';
  var KEYS = { DAILY: 'daily', SESSIONS: 'sessions', SETS: 'sets', FOOD_LOG: 'foodLog', FOODS: 'foods', MEALS: 'meals',
    TARGETS: 'targets', PROGRAM: 'program', EXERCISES: 'exercises', MEASURES: 'measures', PHOTOS: 'photos', VIDEOS: 'videos' };
  var DEBOUNCE_MS = 15000;

  var data = null;
  var queue = {};      // { TABLE: { id: record } }
  var dels = {};       // { TABLE: { id: true } }
  var inflight = null;
  var timer = null, retryMs = 0;

    get: function (k, d) { try { var v = localStorage.getItem(PREFIX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

    for (var i = 0; i < list.length; i++) if (list[i].id === rec.id) { list[i] = rec; return; }

    data[KEYS[table]] = (data[KEYS[table]] || []).filter(function (r) { return r.id !== id; });

    Object.keys(queue).forEach(function (t) { Object.keys(queue[t]).forEach(function (id) { applyLocal(t, queue[t][id]); }); });

  function local(table, rec, gone) {

    Object.keys(tables).forEach(function (t) {
      var puts = Object.keys(queue[t] || {}).map(function (id) { return queue[t][id]; });
      var ds = Object.keys(dels[t] || {});

    data: function () { return data; },
    status: function () { return status; },
    onChange: function (fn) { listeners.push(fn); }
  };
})();
</script>
